<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>[hidden]{display:none!important}</style></head><body>
<title>Rift Logic Pro</title>
<meta name="description" content="Tier-1 pro League of Legends (LCK, LPL, LEC, LCS): standings, Elo, teams, rosters, players, drafts and win probability, from Oracle's Elixir.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#07080A; --surface:#0E1014; --surface-2:#13161B; --inset:#1A1E24;
  --ink:#E6E9ED; --ink-2:#B3BAC3; --muted:#8A939E; --faint:#5A626C; --line:#1F242B; --line-strong:#2C323B;
  --accent:#3FB7B4; --accent-ink:#04201F; --accent-soft:#123135;
  --gold:#D4AF63; --ok:#4CC287; --no:#F07580; --warn:#E5AE5A;
  --side1:#5B93E8; --side2:#E26B5F;
  --tagL:34%; --tagS:45%; --lnL:62%; --lnS:62%;
  --shadow:0 16px 40px rgba(0,0,0,.65);
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#EFF2F5; --surface:#FFFFFF; --surface-2:#F6F8FA; --inset:#E9EDF1;
  --ink:#121A23; --ink-2:#36424F; --muted:#5F6B79; --faint:#8C97A3; --line:#DCE2E8; --line-strong:#C4CCD5;
  --accent:#0B6E78; --accent-ink:#FFFFFF; --accent-soft:#DDEFF0;
  --gold:#8A6516; --ok:#1C7A48; --no:#B42F3E; --warn:#935800;
  --side1:#2F6FD0; --side2:#C4453A;
  --tagL:40%; --tagS:55%; --lnL:42%; --lnS:60%;
  --shadow:0 12px 32px rgba(18,26,35,.16);
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);padding-inline:16px;padding-block:0 40px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td,.big{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:1240px;margin:0 auto;display:grid;gap:14px;min-width:0}

/* selector bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-block:10px;background:var(--bg);border-bottom:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:6px 11px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:500 13px/1 var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--inset)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 11px;height:32px;font:500 12.5px/1 var(--sans);cursor:pointer;color:var(--ink-2)}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select{height:32px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface-2);padding:0 8px;font-size:13px;min-width:0}
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%}
.selbar .grow{flex:1}
.cb{position:relative;flex:0 1 280px;min-width:0}
.cb input{width:100%;height:34px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface-2);padding:0 30px 0 32px;font-size:13.5px}
.cb input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.cb .mag{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted);pointer-events:none}
.cb kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:500 11px/1 var(--mono);color:var(--faint);border:1px solid var(--line-strong);border-radius:4px;padding:2px 5px;pointer-events:none}
.cb input:focus ~ kbd{display:none}
.cb-list{position:absolute;z-index:50;left:0;right:0;top:calc(100% + 4px);min-width:260px;max-height:min(380px,60vh);overflow-y:auto;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow)}
.cb-list li{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:5px;cursor:pointer;font-size:13px}
.cb-list li small{margin-left:auto;color:var(--muted);font-size:11.5px;white-space:nowrap}
.cb-list li[aria-selected="true"]{background:var(--accent-soft)}
.cb-list li.none{color:var(--muted);cursor:default}
.cb-list li svg{width:18px;height:18px;fill:var(--muted);flex:none}
.dsf{display:flex;flex-wrap:wrap;gap:6px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12.5px;color:var(--muted);min-height:22px}
.crumbs ol{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0;padding:0;list-style:none}
.crumbs li + li::before{content:"›";margin-right:4px;color:var(--faint)}
.crumbs a{color:var(--ink-2);text-decoration:none}.crumbs a:hover{color:var(--accent);text-decoration:underline}
.crumbs [aria-current]{color:var(--ink);font-weight:500}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:9px 12px;color:var(--ink-2);text-decoration:none;font:500 13.5px/1 var(--sans);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.rtabs{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--surface)}
.rtabs button{display:inline-flex;align-items:center;gap:5px;border:0;background:none;padding:0 9px;height:32px;font:500 12.5px/1 var(--sans);cursor:pointer;color:var(--ink-2)}
.rtabs button + button{border-left:1px solid var(--line)}
.rtabs button svg{width:17px;height:17px;fill:currentColor;flex:none}
.rtabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* layout */
#main{min-width:0;display:grid;gap:18px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.head h1{margin:0;font:600 24px/1.15 var(--sans)}
.head .sub{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid var(--line-strong);border-radius:999px;font:500 12px/1 var(--sans);color:var(--ink-2);background:var(--surface);white-space:nowrap;text-decoration:none}
.chip svg{width:14px;height:14px;fill:currentColor;flex:none}
a.chip:hover{border-color:var(--accent)}
.chip.w{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.chip.l{color:var(--no);border-color:color-mix(in srgb,var(--no) 45%,transparent)}
.note{color:var(--muted);font-size:12.5px;margin:0}
.sec{display:grid;gap:10px;min-width:0}
.sec > h2{margin:4px 0 0;font:600 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.sec > h2 a{color:inherit;text-decoration:none}.sec > h2 a:hover{color:var(--accent)}
.sec > h2 small{letter-spacing:0;text-transform:none;font-weight:400;color:var(--faint);font-size:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0;display:grid;gap:10px;align-content:start}
.panel h3{margin:0;font:600 11.5px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel h3 small{letter-spacing:0;text-transform:none;font-weight:400;color:var(--faint)}
.cards6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:2px}
.card h3{margin:0 0 6px;font:600 11.5px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .big{font:600 28px/1.1 var(--sans);letter-spacing:-.01em}
.card .ci{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.4}
.up{color:var(--ok)}.dn{color:var(--no)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.loading i{display:inline-block;width:18px;height:18px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-4px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.err{border-color:var(--no);color:var(--no)}
.notice{background:var(--surface);border:1px dashed var(--line-strong);border-radius:8px;padding:14px;display:grid;gap:8px;max-width:760px}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}

/* team tag badge (colour from the team name) */
.tag{display:inline-grid;place-items:center;min-width:38px;height:22px;padding:0 5px;border-radius:5px;font:700 10.5px/1 var(--mono);letter-spacing:.02em;color:#fff;background:hsl(var(--th) var(--tagS) var(--tagL));flex:none;text-decoration:none;white-space:nowrap}
.tag.md{min-width:46px;height:30px;font-size:12px;border-radius:7px}
.tag.lg{min-width:64px;height:64px;font-size:17px;border-radius:12px}
.ri{display:inline-grid;place-items:center;width:18px;height:18px;color:var(--muted);flex:none}
.ri svg{width:18px;height:18px;fill:currentColor;display:block}

/* champion portraits */
.ph{width:32px;height:32px;border-radius:5px;overflow:hidden;background:var(--inset);flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.ph img{display:block;width:100%;height:100%}
.ph .mono{display:grid;place-items:center;width:100%;height:100%;font:600 10px/1 var(--sans);color:#fff}
.ph.xs{width:22px;height:22px;border-radius:4px}
.ph.sm{width:26px;height:26px;border-radius:4px}
.ph.bn{filter:grayscale(1);opacity:.6}

/* tier bands (the stats page's component): one band per tier, best first left to right */
.tiers{display:grid;gap:6px}
.band{display:grid;grid-template-columns:64px minmax(0,1fr);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:8px;background:var(--surface-2);min-width:0}
.band .bh{display:grid;align-content:center;justify-items:center;gap:3px;padding:8px 4px;border-right:1px solid var(--line);text-align:center}
.band .bh h3{margin:0;font:700 22px/1 var(--sans);color:var(--tc)}
.band .bh small{font-size:10.5px;color:var(--muted);line-height:1.2}
.band .grid{padding:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.grid.ch{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.tile{position:relative;display:grid;justify-items:center;align-content:start;gap:3px;padding:9px 5px 7px;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);min-width:0;border-top:3px solid var(--tc,var(--line-strong))}
.tile:hover{border-color:var(--accent);border-top-color:var(--tc,var(--accent))}
.tile .ph{width:44px;height:44px;border-radius:6px}
.tile b{font:500 12px/1.2 var(--sans);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .wr{font:600 13px/1.1 var(--mono)}
.tile small{font-size:10.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tb{position:absolute;top:5px;left:6px;font:700 10px/1 var(--mono);color:var(--tc)}
.tile .ri{position:absolute;top:4px;right:5px;width:14px;height:14px}
.tile .ri svg{width:14px;height:14px}
.tile .spk{width:84px;height:20px;display:block}
.tile.small{opacity:.5;border-top-color:var(--line-strong)}
.t-S{--tc:#E4B94F}.t-A{--tc:var(--ok)}.t-B{--tc:var(--accent)}.t-C{--tc:var(--muted)}.t-D{--tc:var(--no)}
:root[data-theme="light"] .t-S{--tc:#A07310}
details.lowg summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin:4px 0}

/* horizontal drag-scroll rows (dragScroll): hidden scrollbar, fade edges, arrow buttons */
.hs{position:relative;min-width:0}
.hs-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(244px,260px);gap:10px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding-inline:2px;padding:2px 2px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hs-row.tiles{grid-auto-columns:124px}
.hs-row::-webkit-scrollbar{display:none}
.hs-row > *{scroll-snap-align:start}
.drag.ovf{cursor:grab}
.drag.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none;scroll-snap-type:none;scroll-behavior:auto}
.drag.dragging a{cursor:grabbing}
.hs-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.hs::before,.hs::after{content:"";position:absolute;top:0;bottom:4px;width:40px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:1}
.hs::before{left:0;background:linear-gradient(to right,var(--bg),transparent)}
.hs::after{right:0;background:linear-gradient(to left,var(--bg),transparent)}
.hs.more-l::before,.hs.more-r::after{opacity:1}
.hs-nav{display:inline-flex;gap:4px;margin-left:auto;letter-spacing:0;text-transform:none}
.hs-nav .btn{width:32px;padding:0;justify-content:center;font-size:16px}
.hs-nav .btn:disabled{opacity:.35;cursor:default}

/* game cards */
.gc{display:grid;gap:7px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--ink);min-width:0}
.gc:hover{border-color:var(--accent)}
.gc.w{border-left-color:var(--ok)}.gc.l{border-left-color:var(--no)}
.gc .top{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.gc .top .res{margin-left:auto;font:700 12px/1 var(--mono)}
.gc.w .res{color:var(--ok)}.gc.l .res{color:var(--no)}
.gc .tm{display:flex;align-items:center;gap:7px;min-width:0;font-size:12.5px}
.gc .tm b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc .tm.won b{font-weight:600}
.gc .tm .x{margin-left:auto;display:flex;gap:2px}
.gc .ft{display:flex;align-items:center;gap:8px;font:500 11.5px/1 var(--mono);color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.gc .ft .spk{margin-left:auto;width:96px;height:24px}
.gc .kda{font:600 13px/1 var(--mono);color:var(--ink)}

/* charts */
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:500 10.5px var(--sans);fill:var(--muted)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ref{stroke:var(--line-strong);stroke-width:1;stroke-dasharray:3 3}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke:hsl(var(--th,180) var(--lnS) var(--lnL))}
.chart .ln.acc{stroke:var(--accent)}
.chart .ln.mut{stroke:var(--faint);stroke-width:1.25;opacity:.55}
.chart .ln.dash{stroke-dasharray:5 4;stroke:var(--ink-2);stroke-width:1.5}
.chart .pt{fill:hsl(var(--th,180) var(--lnS) var(--lnL));stroke:var(--surface);stroke-width:2}
.chart .pt.acc{fill:var(--accent)}
.chart .pt.w{fill:var(--ok)}.chart .pt.l{fill:var(--no)}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .lbl{font-weight:600;fill:var(--ink-2)}
.chart .lbl.acc{fill:var(--ink)}
.chart .sr0{transition:opacity .12s}
.chart .lines:hover .sr0{opacity:.2}
.chart .lines .sr0:hover{opacity:1}
.chart .lines .sr0:hover .ln{stroke-width:3}
.chart .area{fill:var(--accent);opacity:.12}
.chart .dot{fill:var(--faint);opacity:.55}
.chart .dot.me{fill:var(--accent);opacity:1;stroke:var(--surface);stroke-width:2}
.chart .wpb{stroke:var(--side1)}.chart .wpr{stroke:var(--side2)}
.spk{display:block;overflow:visible}
.spk .z{stroke:var(--line-strong);stroke-width:1;stroke-dasharray:2 2}
.spk path{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round}
.spk path.up{stroke:var(--ok)}.spk path.dn{stroke:var(--no)}
.spk circle{fill:var(--accent)}
.spk circle.up{fill:var(--ok)}.spk circle.dn{fill:var(--no)}
/* horizontal bars */
.bars{display:grid;gap:7px}
.hb{display:grid;grid-template-columns:minmax(0,var(--lw,128px)) minmax(0,1fr) minmax(52px,auto);align-items:center;gap:8px;font-size:12.5px;min-width:0}
.hb .hl{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--ink-2)}
.hb .hl a{color:var(--ink-2);text-decoration:none;overflow:hidden;text-overflow:ellipsis}.hb .hl a:hover{color:var(--accent)}
.hb .ht{position:relative;height:10px;border-radius:5px;background:var(--inset)}
.hb .ht i{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--c,var(--accent))}
.hb .ht u{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink-2);opacity:.55;border-radius:1px}
.hb .hv{font:500 12px/1 var(--mono);text-align:right;white-space:nowrap}
.hb .hv small{color:var(--muted);font-size:10.5px;margin-left:4px}
.hb.me .hl{color:var(--ink);font-weight:600}
.cmp{display:grid;grid-template-columns:minmax(48px,auto) minmax(0,1fr) minmax(0,1fr) minmax(48px,auto);align-items:center;gap:4px 8px;font-size:12.5px}
.cmp .v{font:500 12px/1 var(--mono)}.cmp .v.r{text-align:right}
.cmp .k{grid-column:1/-1;text-align:center;font-size:11px;color:var(--muted);margin-top:4px}
.cmp .b{height:10px;background:var(--inset);position:relative}
.cmp .b i{position:absolute;top:0;bottom:0}
.cmp .b.l{border-radius:5px 0 0 5px}.cmp .b.l i{right:0;background:var(--side1);border-radius:5px 0 0 5px}
.cmp .b.r{border-radius:0 5px 5px 0}.cmp .b.r i{left:0;background:var(--side2);border-radius:0 5px 5px 0}
.cmp .b.l.lead i{box-shadow:0 0 0 1px var(--side1)}
.mults{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cols{position:relative;display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line-strong)}
.cols .c{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:1px;height:100%;min-width:0}
.cols .c i{display:block;flex:1;max-width:22px;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px}
.cols .c i.pe{background:var(--line-strong)}
.cols-x{display:flex;gap:3px;font-size:10px;color:var(--muted);font-family:var(--mono)}
.cols-x span{flex:1;text-align:center;min-width:0;overflow:hidden}
.split{display:flex;height:26px;border-radius:6px;overflow:hidden;font:600 12px/26px var(--mono);color:#fff}
.split i{font-style:normal;padding:0 8px;white-space:nowrap;overflow:hidden}
.split .b{background:var(--side1)}.split .r{background:var(--side2);text-align:right}
.pgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.pc{display:grid;gap:6px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0;text-decoration:none;color:var(--ink)}
.pc .nm{display:flex;align-items:center;gap:6px;min-width:0}
.pc .nm a{font:600 14px/1.2 var(--sans);color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .nm a:hover{color:var(--accent)}
.pc dl{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;margin:0;font-size:12px}

/* player rankings: per role, tier bands by WPA per game */
function leaguePlayers(r, c, D, games){

  const min = minGames(all);

  const byWpa = all.filter(x => x.agg.n >= min && x.agg.mm.wpa != null).length >= Math.min(5, all.filter(x => x.agg.n >= min).length) && all.some(x => x.agg.mm.wpa != null);
  const val = x => byWpa ? x.agg.mm.wpa : x.agg.kda, vtxt = x => byWpa ? pp(x.agg.mm.wpa).replace(" pp", "") : f1(x.agg.kda);
  const ok = all.filter(x => x.agg.n >= min && val(x) != null), small = all.filter(x => !(x.agg.n >= min && val(x) != null));
  const rk = assignTiers(ok, val, x => x.agg.n);
  const tile = x => h("a", {class: "tile" + (x.tier ? " t-" + x.tier : " small"), href: playerLink(c, x.name, D.L), "data-player": x.name,
    title: `${x.name} (${x.team}, ${ROLE_L[x.agg.mainRole]}): ${x.agg.n} games, WPA ${pp(x.agg.mm.wpa)} per game (lane ${pp(x.agg.mm.wpaL)}), KDA ${f1(x.agg.kda)}`},
    x.tier ? h("span", {class: "tb", "aria-hidden": "true"}, "#" + x.rank) : null, roleIcon(x.agg.mainRole), tagBadge(x.team, "md"), h("b", {}, x.name),
    h("span", {class: "wr"}, vtxt(x)), h("small", {}, byWpa ? `KDA ${f1(x.agg.kda)} · ${x.agg.n} g` : `${pct(x.agg.kp)} KP · ${x.agg.n} g`));

      x: {label: "gold share", fmt: v => pct(v)}, y: {label: "damage share", fmt: v => pct(v)}}))));

    panel("Team stats", h("div", {class: "cmp", id: "gcmp"}, CMP.map(([k, lab, fm]) => { const a = ts(g, 0, k), b = ts(g, 1, k); if (a == null && b == null) return null; const mx = Math.max(a || 0, b || 0) || 1, F = fm || (v => grp(v || 0));
      return [h("div", {class: "k"}, lab), h("span", {class: "v"}, F(a || 0)), h("div", {class: "b l", "data-tip": `${TN(0)}: ${F(a || 0)} ${lab.toLowerCase()}`}, h("i", {style: `width:${100 * (a || 0) / mx}%`})),
        h("div", {class: "b r", "data-tip": `${TN(1)}: ${F(b || 0)} ${lab.toLowerCase()}`}, h("i", {style: `width:${100 * (b || 0) / mx}%`})), h("span", {class: "v r"}, F(b || 0))]; })),
      h("div", {class: "chips"}, FIRSTS.map(([k, lab]) => { const s = ts(g, 0, k) === 1 ? 0 : ts(g, 1, k) === 1 ? 1 : null; return s == null ? null : h("span", {class: "chip"}, tagBadge(TN(s)), lab); }))),
    panel(h("span", {}, "Gold difference ", h("small", {}, TN(0))), lineChart({title: `${TN(0)} gold difference at 10, 15, 20 and 25 minutes`, w: chartW(0.5), hh: 200, y: {ref: 0, fmt: v => sgn(v)}, x: {ticks: [10, 15, 20, 25], fmt: v => v + "′", min: 10, max: 25},
      series: [{key: "gd", label: TN(0), short: IX.tags[TN(0)] || TN(0), cls: "acc", emph: true, dots: 3.5, pts: g.gd.map((v, j) => v == null ? null : {x: IX.timesWP[j], y: v, tip: `${IX.timesWP[j]} min: ${TN(0)} ${sgn(v)} gold`}).filter(Boolean)}]}))));
  // players
  const head = ["Player", "Champion", "K / D / A", "CS", "Gold", "Damage", "DPM", "Vision", "GD@15", "WPA", "Lane", "Team", "Draft"];
  const trs = [];
  for (const s of [0, 1]) for (let ro = 0; ro < 5; ro++){
    const rr = g.ps[s][ro], v = k => rr ? rr[PSI[k]] : null, pn = D.players[g.pl[s][ro]];
    trs.push(h("tr", {class: s && !ro ? "sep" : null, "data-player": pn}, h("th", {}, h("a", {href: playerLink(c2, pn, D.L)}, roleIcon(ro), tagBadge(TN(s)), h("b", {}, pn))),
      h("td", {class: "l"}, h("span", {style: "display:inline-flex;align-items:center;gap:6px"}, portrait(g.ch[s][ro], "xs"), nameOf(CH[g.ch[s][ro]]))),
      h("td", {}, `${v("k")} / ${v("d")} / ${v("a")}`), h("td", {}, v("cs") != null ? grp(v("cs")) : "–"), h("td", {}, v("gold") != null ? grp(v("gold")) : "–"), h("td", {}, grp(v("dmg") || 0)),
      h("td", {}, grp((v("dmg") || 0) / g.min)), h("td", {}, v("vs") != null ? String(v("vs")) : "–"), h("td", {}, sgn(v("gd15"))),
      h("td", {class: v("wpa") > 0 ? "up" : v("wpa") < 0 ? "dn" : ""}, pp(v("wpa"))), h("td", {}, pp(v("wpaL"))), h("td", {}, pp(v("wpaT"))), h("td", {}, pp(v("wpaD")))));
  }
  out.push(sec("Players", dragScroll(h("div", {class: "tw", tabindex: "0", role: "region", "aria-label": "Players table (scrolls sideways)"}, h("table", {id: "ptable"}, h("caption", {class: "sr"}, "Players of both teams: stats and win probability added (percentage points)"), h("thead", {}, h("tr", {}, head.map((x, k) => h("th", {class: k < 2 ? "l" : null, scope: "col"}, x)))), h("tbody", {}, trs))))));
  return out;
}

/* ---------- boot ---------- */
let RTOK = 0, IDLE = Promise.resolve();
function render(){
  if (!IX) return IDLE;
  const tok = ++RTOK, r = parseHash(), c = ctx(r.q);
  CTX = c;
  const V = {home: viewHome, league: viewLeague, team: viewTeam, player: viewPlayer, game: viewGame}[r.view] || viewHome;
  const main = $("main");
  if (!main.firstElementChild || !main.querySelector(".loading")){ /* keep the old view until the new one is ready */ }
  IDLE = Promise.resolve().then(() => V(r, c)).then(nodes => {
    if (tok !== RTOK) return;
    main.textContent = ""; main.append(...nodes);
    document.title = ({home: "Pro leagues", league: (r.args[0] || "").toUpperCase(), team: r.args[0], player: r.args[0], game: "Game"}[r.view] || "Pro leagues") + " · Rift Logic Pro";
  }).catch(e => { if (tok !== RTOK) return; main.textContent = ""; main.append(h("div", {class: "notice err"}, `Something went wrong: ${e.message}`)); console.error(e); });
  return IDLE;
}
let lastW = 0;
function start(d){
  IX = d; CH = IX.champs; IX.defaultYear = String(Math.max(...Object.keys(IX.years).map(Number)));
  TSI = Object.fromEntries(IX.ts.map((k, i) => [k, i])); PSI = Object.fromEntries(IX.ps.map((k, i) => [k, i]));
  loadIcons(); render();
  window.addEventListener("hashchange", () => { render().then(() => { $("main").focus({preventScroll: true}); window.scrollTo(0, 0); }); });
  lastW = window.innerWidth;
  window.addEventListener("resize", () => { clearTimeout(start.t); start.t = setTimeout(() => { if (Math.abs(window.innerWidth - lastW) > 120){ lastW = window.innerWidth; render(); } }, 250); });
}
const ready = PAGE.inline ? Promise.resolve(PAGE.inline.index) : fetch("pro.json").then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); });
window.__pro = {ready: ready.then(d => { start(d); return IDLE.then(() => true); }, e => { $("main").textContent = ""; $("main").append(h("div", {class: "notice err"}, `The pro data (pro.json) could not be loaded: ${e.message}. Reload to try again.`)); throw e; }),
  idle: () => IDLE, render, league: (y, L) => loadLeague(y, L), standings, teamAgg, teamGames, pAgg, playerRows, gamesSel, ctx: () => CTX};
})();
