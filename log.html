<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rift Logic Debates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EFF2F5; --surface:#FFFFFF; --surface-2:#F6F8FA; --inset:#E9EDF1; --code-bg:#FBFCFD;
  --ink:#121A23; --ink-2:#36424F; --muted:#677483; --faint:#9AA5B1; --line:#DCE2E8; --line-strong:#C4CCD5;
  --accent:#0B6E78; --accent-ink:#FFFFFF; --accent-soft:#DDEFF0;
  --gold:#8A6516; --ok:#1C7A48; --ok-soft:#E0F1E7; --no:#B42F3E; --no-soft:#F8E3E5; --warn:#935800; --warn-soft:#F6EAD5;
  --phys:#C8621A; --magic:#5563D8; --true:#8B95A1; --heal:#2F8F46; --shield:#9AA6B2;
  --phys-t:#A5500F; --magic-t:#4350C4; --true-t:#3B4450; --heal-t:#257537; --shield-t:#5D6A77;
  --side1:#2F6FD0; --side2:#C4453A;
  --kw:#7A3EAA; --ty:#0B6E78; --ch:#8A6516; --num:#A8385A; --str:#2E7A3A; --cmt:#7D8894;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --shadow:0 12px 32px rgba(18,26,35,.16);
  --a:#2F6FD0; --b:#A83E78; --ref:#0B6E78; --skep:#935800; --orch:#677483; --syn:#7A3EAA;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1218; --surface:#131A22; --surface-2:#171F29; --inset:#1C2530; --code-bg:#10161D;
    --ink:#E2E8EE; --ink-2:#B8C2CC; --muted:#84919F; --faint:#566270; --line:#242E39; --line-strong:#323E4B;
    --accent:#3FB7B4; --accent-ink:#04201F; --accent-soft:#123135;
    --gold:#D4AF63; --ok:#4CC287; --ok-soft:#12301F; --no:#F07580; --no-soft:#3A1A20; --warn:#E5AE5A; --warn-soft:#33260F;
    --phys:#D6772F; --magic:#7482EC; --true:#C3CBD3; --heal:#42A95A; --shield:#7C8A98;
    --phys-t:#F0A060; --magic-t:#A4ADFF; --true-t:#EEF1F4; --heal-t:#72D08B; --shield-t:#B4C0CB;
    --side1:#5B93E8; --side2:#E26B5F;
    --kw:#C49DF2; --ty:#4FC1BD; --ch:#D4AF63; --num:#F28DA8; --str:#8FCB80; --cmt:#65717F;
    --shadow:0 12px 32px rgba(0,0,0,.5);
    --a:#6EA2F0; --b:#E48BBE; --ref:#3FB7B4; --skep:#E5AE5A; --orch:#84919F; --syn:#C49DF2;

  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1218; --surface:#131A22; --surface-2:#171F29; --inset:#1C2530; --code-bg:#10161D;
  --ink:#E2E8EE; --ink-2:#B8C2CC; --muted:#84919F; --faint:#566270; --line:#242E39; --line-strong:#323E4B;
  --accent:#3FB7B4; --accent-ink:#04201F; --accent-soft:#123135;
  --gold:#D4AF63; --ok:#4CC287; --ok-soft:#12301F; --no:#F07580; --no-soft:#3A1A20; --warn:#E5AE5A; --warn-soft:#33260F;
  --phys:#D6772F; --magic:#7482EC; --true:#C3CBD3; --heal:#42A95A; --shield:#7C8A98;
  --phys-t:#F0A060; --magic-t:#A4ADFF; --true-t:#EEF1F4; --heal-t:#72D08B; --shield-t:#B4C0CB;
  --side1:#5B93E8; --side2:#E26B5F;
  --kw:#C49DF2; --ty:#4FC1BD; --ch:#D4AF63; --num:#F28DA8; --str:#8FCB80; --cmt:#65717F;
  --shadow:0 12px 32px rgba(0,0,0,.5);
    --a:#6EA2F0; --b:#E48BBE; --ref:#3FB7B4; --skep:#E5AE5A; --orch:#84919F; --syn:#C49DF2;

}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--sans);padding-inline:16px;padding-block:0 60px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:14px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:grid;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.brand{display:flex;align-items:center;gap:8px;font:600 15.5px/1 var(--sans);margin-right:auto}
.brand svg{width:18px;height:18px}
.brand span{color:var(--muted);font-weight:500}
h1{font:inherit;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
select,button{font:500 13px/1 var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:7px 10px;cursor:pointer;min-height:32px}
select:hover,button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.live{font:11.5px var(--mono);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs button{border-color:transparent;background:transparent;color:var(--muted);font-weight:600;font-size:12.5px}
.tabs button:hover{background:var(--inset);color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:var(--line)}
#roles button{font:500 12px var(--mono);padding:5px 8px;min-height:28px}
.entries{display:grid;gap:8px}
.e{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:grid;gap:6px}
.e.new{animation:flash 1.8s ease-out}
@keyframes flash{from{box-shadow:0 0 0 2px var(--accent)}to{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.e.new{animation:none}}
.head{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.time{font:11.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.role{font:600 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--role)}
.role::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--role);margin-right:6px;vertical-align:0}
.title{font-weight:600}
.f{display:grid;grid-template-columns:78px minmax(0,1fr);gap:3px 12px;font-size:13.5px;margin:0}
.f dt{font:600 10px/1.9 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.f dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.f a,.msg .body a{color:var(--accent);font-family:var(--mono);font-size:12.5px}
.verdict{font:600 10px/1 var(--sans);letter-spacing:.07em;padding:3px 6px;border-radius:4px;margin-right:6px;vertical-align:1px}
.v-ok{background:var(--ok-soft);color:var(--ok)}.v-no{background:var(--no-soft);color:var(--no)}.v-j{background:var(--warn-soft);color:var(--warn)}
.chat{display:grid;gap:10px}
.msg{max-width:min(760px,94%);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;gap:5px}
.msg.right{justify-self:end;background:var(--surface-2)}
.msg .to{color:var(--muted);font-size:12.5px}
.msg .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.tag{font:600 10px var(--sans);letter-spacing:.07em;padding:1px 5px;border-radius:3px;background:var(--warn-soft);color:var(--warn)}
pre.doc{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font:12.5px/1.65 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--muted);border:1px dashed var(--line-strong);border-radius:8px;padding:16px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow">
      <h1 class="brand"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5 17.4 5.75v8.5L10 18.5 2.6 14.25v-8.5Z" fill="none" stroke="var(--accent)" stroke-width="1.6"/><path d="M6.5 12.5 10 5.5l3.5 7" fill="none" stroke="var(--gold)" stroke-width="1.6" stroke-linejoin="round"/></svg>Rift Logic <span>Debates</span></h1>
      <label class="live" for="q"><span class="dot"></span>Question</label>
      <select id="q"></select>
      <span class="live" id="status">loading…</span>
    </div>
    <div class="bar">
    <div class="tabs" role="tablist">
      <button type="button" data-tab="conversation.md" aria-pressed="true">Conversation</button>
      <button type="button" data-tab="log" aria-pressed="false">Evidence notebook</button>
      <button type="button" data-tab="ledger.md" aria-pressed="false">Ledger</button>
      <button type="button" data-tab="question.md" aria-pressed="false">Question</button>
      <button type="button" data-tab="verdict.md" aria-pressed="false">Verdict</button>
    </div>
    <div class="tabs" id="roles"></div>
    <button type="button" id="order" aria-pressed="false">Newest first</button>
  </div>
    <div class="legend">
    <span style="--c:var(--a)">Advocate A</span><span style="--c:var(--b)">Advocate B</span><span style="--c:var(--ref)">Referee</span>
    <span style="--c:var(--skep)">Skeptic</span><span style="--c:var(--syn)">Synthesiser</span><span style="--c:var(--orch)">Orchestrator</span>
  </div>
  </header>
  <div id="view"></div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const roleVar = r => /advocate a/i.test(r) ? "--a" : /advocate b/i.test(r) ? "--b" : /referee/i.test(r) ? "--ref" : /skeptic/i.test(r) ? "--skep" : /synth/i.test(r) ? "--syn" : "--orch";
  let tab = "conversation.md", slug = null, seen = new Set(), newestFirst = false, roleFilter = null, lastText = "";
  try { newestFirst = localStorage.getItem("debates.newest") === "1"; } catch (_) {}
  $("order").setAttribute("aria-pressed", String(newestFirst));
  $("roles").hidden = true;

  // Debates live in ../reasoning, which only the local dev server exposes (the public site blocks it).
  // Question slugs come from the directory listing, else from reasoning/INDEX.md; neither → a notice, no polling.
  let available = true;
  async function listQuestions(){
    let slugs = [];
    try {
      const r = await fetch("reasoning/", {cache:"no-store"});
      if (r.ok) slugs = [...(await r.text()).matchAll(/href="([a-z0-9-]+)\/"/g)].map(m => m[1]);
      if (!slugs.length){ const i = await fetch("reasoning/INDEX.md", {cache:"no-store"}); if (i.ok) slugs = [...(await i.text()).matchAll(/\|\s*`([a-z0-9-]+)`\s*\|/g)].map(m => m[1]); }
    } catch (_) {}
    slugs = [...new Set(slugs)].filter(s => /^[a-z0-9][a-z0-9-]*$/.test(s));
    available = slugs.length > 0;
    if (!available){ $("status").textContent = "offline"; $("view").innerHTML = `<div class="empty">The debate logs are only available when Rift Logic runs locally (<code>python3 -m http.server --bind 127.0.0.1</code> in <code>web/</code>).</div>`; return; }
    const sel = $("q"); const cur = sel.value;
    sel.replaceChildren(...slugs.map(s => Object.assign(document.createElement("option"), {value:s, textContent:s})));
    if (slugs.includes(cur)) sel.value = cur; else if (slugs.length) sel.value = slugs[slugs.length-1];
    slug = sel.value || null;
  }
  // escaped text with check files linked; tags=true also marks judgement/model-limit (one pass, so a tag can never
  // land inside a link's href)
  function linkChecks(text, tags){
    const re = tags ? /((?:checks\/)?[ab]?-?\d*-?[\w.-]*\.(?:rl|out))|\b(judgement|model-limit)\b/gi : /((?:checks\/)?[ab]?-?\d*-?[\w.-]*\.(?:rl|out))/g;
    return esc(text).replace(re, (m, file, tag) => {
      if (tag) return `<span class="tag">${tag}</span>`;
      const path = encodeURI(m.startsWith("checks/") ? m : "checks/" + m), base = `reasoning/${encodeURIComponent(slug)}/`;
      return `<a href="${base}${path}" target="_blank" rel="noopener noreferrer">${m}</a>` + (m.endsWith(".rl") ? ` <a href="${base}${path.replace(/\.rl$/,".out")}" target="_blank" rel="noopener noreferrer">(output)</a>` : "");
    });
  }
  function parseLog(text){
    const parts = text.split(/\n(?=### )/).filter(p => p.startsWith("### "));
    return parts.map(p => {
      const [head, ...rest] = p.split("\n");
      const m = head.replace(/^###\s*/, "").split(" · ");
      const body = rest.join("\n").trim();
      const fields = []; let cur = null;
      for (const line of body.split("\n")){
        const fm = line.match(/^(Why|Check|Result|Takeaway|Note|Claim|Status)\s*:\s*(.*)$/i);
        if (fm){ cur = {k: fm[1], v: fm[2]}; fields.push(cur); }
        else if (cur) cur.v += "\n" + line; else { cur = {k:"Note", v: line}; fields.push(cur); }
      }
      return {id: head, time: m[0] || "", role: m[1] || "", title: m.slice(2).join(" · "), fields};
    });
  }
  function badge(v){
    if (/^\s*(PROVED|VERIFIED|HOLDS|CONFIRMED)/i.test(v)) return `<span class="verdict v-ok">${esc(v.match(/^\s*\w+/)[0].toUpperCase())}</span>` + linkChecks(v.replace(/^\s*\w+\s*[—:-]?\s*/, ""));
    if (/^\s*(REFUTED|FAILS|WRONG|REJECTED)/i.test(v)) return `<span class="verdict v-no">${esc(v.match(/^\s*\w+/)[0].toUpperCase())}</span>` + linkChecks(v.replace(/^\s*\w+\s*[—:-]?\s*/, ""));
    return linkChecks(v);
  }
  function renderLog(text){
    let es = parseLog(text);
    const roles = [...new Set(es.map(e => e.role))];
    $("roles").replaceChildren(...["All", ...roles].map(r => { const b = document.createElement("button"); b.type="button"; b.textContent=r; b.setAttribute("aria-pressed", String((roleFilter||"All")===r)); b.onclick=()=>{ roleFilter = r==="All"?null:r; renderLog(lastText); }; return b; }));
    if (roleFilter) es = es.filter(e => e.role === roleFilter);
    if (newestFirst) es = es.slice().reverse();
    if (!es.length){ $("view").innerHTML = `<div class="empty">No log entries yet.</div>`; return; }
    const fresh = seen.size > 0;
    $("view").innerHTML = `<div class="entries">${es.map(e => {
      const isNew = fresh && !seen.has(e.id);
      const judg = e.fields.some(f => /^check$/i.test(f.k) && /judg/i.test(f.v));
      return `<article class="e${isNew?" new":""}" style="--role:var(${roleVar(e.role)})">
        <div class="head"><span class="time">${esc(e.time)}</span><span class="role">${esc(e.role)}</span><span class="title">${esc(e.title)}</span>${judg?'<span class="verdict v-j">JUDGEMENT</span>':""}</div>
        <dl class="f">${e.fields.map(f => `<dt>${esc(f.k)}</dt><dd>${/^result$/i.test(f.k) ? badge(f.v) : linkChecks(f.v)}</dd>`).join("")}</dl></article>`;
    }).join("")}</div>`;
    for (const e of parseLog(text)) seen.add(e.id);
  }
  function renderChat(text){
    const parts = text.split(/\n(?=## )/).filter(p => p.startsWith("## "));
    if (!parts.length){ $("view").innerHTML = `<div class="empty">The conversation starts once both opening cases are in.</div>`; return; }
    const fresh = seen.size > 0;
    let msgs = parts.map(p => { const [head, ...rest] = p.split("\n"); const m = head.replace(/^##\s*/, "").split(" · "); const [who, to] = (m[1]||"").split(" → "); return {id: head, time: m[0], who: who||"", to: to||"", body: rest.join("\n").trim()}; });
    if (newestFirst) msgs = msgs.slice().reverse();
    $("view").innerHTML = `<div class="chat">${msgs.map(x => {
      const right = /advocate b|skeptic/i.test(x.who);
      const body = linkChecks(x.body, true);
      return `<article class="msg${right?" right":""}${fresh && !seen.has(x.id)?" e new":""}" style="--role:var(${roleVar(x.who)})">
        <div class="head"><span class="time">${esc(x.time||"")}</span><span class="role">${esc(x.who)}</span><span class="to">to ${esc(x.to)}</span></div>
        <div class="body">${body}</div></article>`; }).join("")}</div>`;
    for (const x of msgs) seen.add(x.id);
  }
  async function refresh(){
    if (!available) return;
    if (!slug) { $("view").innerHTML = `<div class="empty">No questions yet.</div>`; return; }
    const file = tab === "log" ? "log.md" : tab;
    try {
      const r = await fetch(`reasoning/${slug}/${file}`, {cache:"no-store"});
      const text = r.ok ? await r.text() : "";
      $("status").textContent = `updated ${new Date().toLocaleTimeString()}`;
      if (text === lastText) return;
      lastText = text;
      if (tab === "log") renderLog(text);
      else if (tab === "conversation.md") renderChat(text);
      else $("view").innerHTML = text ? `<pre class="doc">${linkChecks(text)}</pre>` : `<div class="empty">${esc(file)} doesn't exist yet.</div>`;
    } catch (e) { $("status").textContent = "can't reach the local server"; }
  }
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
    tab = b.dataset.tab; lastText = "";
    document.querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    $("roles").hidden = tab !== "log"; $("order").hidden = !(tab === "log" || tab === "conversation.md"); seen = new Set(); refresh();
  });
  $("order").onclick = () => { newestFirst = !newestFirst; $("order").setAttribute("aria-pressed", String(newestFirst)); try { localStorage.setItem("debates.newest", newestFirst ? "1" : "0"); } catch (_) {} lastText = ""; refresh(); };
  $("q").onchange = () => { slug = $("q").value; seen = new Set(); lastText = ""; refresh(); };
  listQuestions().then(refresh);
  setInterval(() => { if (available) refresh(); }, 4000);
  setInterval(listQuestions, 30000);
})();
</script>
</body>
</html>
