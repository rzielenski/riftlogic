<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>[hidden]{display:none!important}</style></head><body>
<title>Rift Logic Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EFF2F5; --surface:#FFFFFF; --surface-2:#F6F8FA; --inset:#E9EDF1;
  --ink:#121A23; --ink-2:#36424F; --muted:#677483; --faint:#9AA5B1; --line:#DCE2E8; --line-strong:#C4CCD5;
  --accent:#0B6E78; --accent-ink:#FFFFFF; --accent-soft:#DDEFF0;
  --gold:#8A6516; --ok:#1C7A48; --no:#B42F3E; --warn:#935800;
  --phys:#C8621A; --magic:#5563D8; --true:#8B95A1;
  --side1:#2F6FD0; --side2:#C4453A; --side1-soft:#E1EBFA; --side2-soft:#F8E4E2;
  --mW:#E4D7A8; --mU:#3A7BD5; --mB:#4A4152; --mR:#D2493C; --mG:#2E8B57; --mC:#A7B0BA;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --shadow:0 12px 32px rgba(18,26,35,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1218; --surface:#131A22; --surface-2:#171F29; --inset:#1C2530;
    --ink:#E2E8EE; --ink-2:#B8C2CC; --muted:#84919F; --faint:#566270; --line:#242E39; --line-strong:#323E4B;
    --accent:#3FB7B4; --accent-ink:#04201F; --accent-soft:#123135;
    --gold:#D4AF63; --ok:#4CC287; --no:#F07580; --warn:#E5AE5A;
    --phys:#D6772F; --magic:#7482EC; --true:#C3CBD3;
    --side1:#5B93E8; --side2:#E26B5F; --side1-soft:#15253C; --side2-soft:#381C1C;
    --mW:#EDE3BD; --mU:#5B93E8; --mB:#8C7F99; --mR:#E26B5F; --mG:#4CB37A; --mC:#8B96A2;
    --shadow:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1218; --surface:#131A22; --surface-2:#171F29; --inset:#1C2530;
  --ink:#E2E8EE; --ink-2:#B8C2CC; --muted:#84919F; --faint:#566270; --line:#242E39; --line-strong:#323E4B;
  --accent:#3FB7B4; --accent-ink:#04201F; --accent-soft:#123135;
  --gold:#D4AF63; --ok:#4CC287; --no:#F07580; --warn:#E5AE5A;
  --phys:#D6772F; --magic:#7482EC; --true:#C3CBD3;
  --side1:#5B93E8; --side2:#E26B5F; --side1-soft:#15253C; --side2-soft:#381C1C;
  --mW:#EDE3BD; --mU:#5B93E8; --mB:#8C7F99; --mR:#E26B5F; --mG:#4CB37A; --mC:#8B96A2;
  --shadow:0 12px 32px rgba(0,0,0,.5);
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);padding-inline:16px;padding-block:0 32px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:1480px;margin:0 auto;display:grid;gap:12px}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-block:10px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;font:600 15.5px/1 var(--sans);min-width:0}
.brand svg{width:18px;height:18px;flex:none}
.brand span{color:var(--muted);font-weight:500}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:6px 11px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:500 13px/1 var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--inset)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;min-height:30px;font:500 12.5px/1 var(--sans);cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sep{width:1px;align-self:stretch;background:var(--line);margin-inline:2px}
#status{font:12px/1.3 var(--sans);color:var(--muted);min-height:1em}
#status.ok{color:var(--ok)}

/* board */
/* one shared height: pick columns and the champion viewport end on the same line */
.board{--bh:clamp(540px,calc(100vh - 118px),860px);display:grid;grid-template-columns:minmax(180px,230px) minmax(0,700px) minmax(180px,230px);justify-content:center;grid-template-areas:"blue mid red";gap:12px;height:var(--bh)}
.team{grid-area:blue;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--side1)}
.team .theme{font:500 11.5px/1.3 var(--sans);color:var(--ink-2);min-height:2.6em}
.team .theme b{font-weight:600}
.team .theme small{color:var(--muted);font-size:11px}
.sortbtn{align-self:stretch;justify-content:center;min-height:28px;font-size:12px}
.team.R{grid-area:red;border-top-color:var(--side2)}
.team h2{margin:0;display:flex;align-items:baseline;justify-content:space-between;font:600 13px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--side1)}
.team.R h2{color:var(--side2)}
.team h2 small{font:500 11px/1 var(--mono);letter-spacing:0;text-transform:none;color:var(--muted)}
.bans{display:flex;gap:4px}
.bans .gap{width:6px}
.bslot{position:relative;width:30px;height:30px;border-radius:5px;border:1px dashed var(--line-strong);background:var(--surface-2);padding:0;cursor:pointer;overflow:hidden;flex:none}
.bslot img,.bslot .mono{width:100%;height:100%;filter:grayscale(1);opacity:.8}
.bslot.filled::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:2px;background:var(--no);transform:rotate(-45deg)}
.bslot.skip{border-style:solid}
.bslot.skip::before{content:"–";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
.picks{flex:1;min-height:0;display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:6px}
.pslot{position:relative;display:grid;grid-template-columns:30px 44px minmax(0,1fr);align-items:center;gap:8px;min-height:50px;padding:5px;border-radius:7px;border:1px dashed var(--line-strong);background:var(--surface-2);cursor:pointer;text-align:left;user-select:none;-webkit-user-select:none}
.pslot.filled{cursor:grab;touch-action:none}
.pslot.dragging{opacity:.5;cursor:grabbing}
.rl{display:grid;justify-items:center;gap:2px;font:600 9.5px/1 var(--sans);letter-spacing:.05em;color:var(--muted)}
.rl svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.pslot.filled{border-style:solid;border-color:var(--line);background:var(--surface)}
.pslot .ph{width:44px;height:44px;border-radius:5px;background:var(--inset);display:grid;place-items:center;color:var(--faint);font:500 11px/1 var(--mono);overflow:hidden}
.pslot .nm{min-width:0;display:grid;gap:3px}
.pslot .nm b{font:600 13.5px/1.15 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pslot .nm i{font:normal 500 11px/1 var(--mono);color:var(--muted)}
.pslot .nm small.off{color:var(--warn)}
.pslot .nm small{font:11px/1.2 var(--sans);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.active{border:2px solid var(--side1)!important;background:var(--side1-soft)!important;animation:pulse 1.6s ease-in-out infinite}
.side-R.active{border-color:var(--side2)!important;background:var(--side2-soft)!important}
.target{outline:2px solid var(--gold);outline-offset:1px}
.over{outline:2px dashed var(--accent);outline-offset:1px}
@keyframes pulse{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--side1) 25%,transparent)}}
.side-R.active{animation-name:pulseR}
@keyframes pulseR{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--side2) 25%,transparent)}}
@media (prefers-reduced-motion:reduce){.active{animation:none}}
.mono{display:grid;place-items:center;width:100%;height:100%;font:600 15px/1 var(--sans);color:#fff;letter-spacing:-.02em}
img.pt{display:block;width:100%;height:100%;object-fit:cover}

.mid{grid-area:mid;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.turn{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:44px}
.turn b{font:600 15px/1 var(--sans)}
.turn .B{color:var(--side1)}.turn .R{color:var(--side2)}
.turn .clock{font:600 15px/1 var(--mono);color:var(--muted);min-width:3ch;text-align:right}
.turn .clock.late{color:var(--no)}
.steps{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.steps i{width:8px;height:8px;border-radius:2px;background:var(--line-strong)}
.steps i.B{background:color-mix(in srgb,var(--side1) 45%,transparent)}.steps i.R{background:color-mix(in srgb,var(--side2) 45%,transparent)}
.steps i.pk{border-radius:50%}
.steps i.done{opacity:.35}
.steps i.now{outline:2px solid var(--ink);outline-offset:1px}
.pool{flex:1;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line)}
.filters input[type=search]{flex:1 1 150px;min-width:0;height:32px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface-2);padding:0 10px;font-size:13.5px}
.filters input[type=search]:focus{outline:none;border-color:var(--accent)}
.pips{display:inline-flex;gap:3px}
.pipbtn{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;opacity:.5}
.pipbtn[aria-pressed="true"]{opacity:1;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:4px;padding:8px;min-height:0;overflow:auto;align-content:start;overscroll-behavior:contain}
.tile{position:relative;display:grid;justify-items:center;gap:3px;padding:4px 2px;border:0;border-radius:6px;background:none;cursor:pointer;min-width:0}
.tile:hover:not(:disabled){background:var(--inset)}
.tile .ph{width:46px;height:46px;border-radius:5px;overflow:hidden;background:var(--inset);box-shadow:inset 0 0 0 1px var(--line)}
.tile span{font:500 11px/1.1 var(--sans);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.tile:disabled{cursor:default}
.tile:disabled .ph{filter:grayscale(1);opacity:.35}
.tile:disabled span{color:var(--faint)}
.tile .cp{position:absolute;top:2px;right:6px;display:flex;gap:1px}
.tile em{position:absolute;top:5px;left:8px;font:600 9px/1 var(--mono);font-style:normal;padding:2px 3px;border-radius:3px;background:var(--no);color:#fff}
.dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 0 1px var(--surface)}
.empty{padding:20px;color:var(--muted);text-align:center;grid-column:1/-1}

/* analysis */
.below{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;width:100%;max-width:1184px;margin-inline:auto}
.foot{margin-inline:auto;width:100%;max-width:1184px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.card.B{border-top:3px solid var(--side1)}.card.R{border-top:3px solid var(--side2)}
.card h3{margin:0 0 10px;font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.card h3 small{font:500 11px/1.2 var(--sans);letter-spacing:0;text-transform:none;color:var(--faint);text-align:right}
.row{display:grid;grid-template-columns:86px minmax(0,1fr);gap:4px 10px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row>label{font:600 10.5px/1.6 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.row .v{min-width:0;font-size:13px;display:grid;gap:4px}
.stack{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--inset)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:2px 10px;font:12px/1.3 var(--sans);color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend .dot{box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:baseline;gap:4px;padding:2px 7px;border-radius:99px;background:var(--inset);font:12px/1.35 var(--sans);color:var(--ink-2)}
.chip b{font-weight:600;color:var(--ink)}
.chip.hard{background:color-mix(in srgb,var(--warn) 16%,transparent)}
.why{color:var(--muted);font-size:12px}
.rng{display:grid;grid-template-columns:72px minmax(0,1fr) 64px;gap:2px 8px;align-items:center;font-size:12px}
.rng .tr{position:relative;height:8px;border-radius:2px;background:var(--inset)}
.rng .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:color-mix(in srgb,var(--accent) 45%,transparent)}
.rng .tr u{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent)}
.rng span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rng span:last-child{text-align:right;color:var(--muted);font-family:var(--mono);font-size:11px}
.sug{grid-column:1/-1}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.srow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);text-align:left;cursor:pointer}
.srow:hover{border-color:var(--accent)}
.srow .ph{width:32px;height:32px;border-radius:4px;overflow:hidden}
.srow b{font-size:13px;font-weight:600;display:block}
.srow small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow small.rs{color:var(--ink-2);white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.srow{grid-template-columns:32px minmax(0,1fr) auto}
.sgrid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.tbars{display:grid;grid-template-columns:70px minmax(0,1fr) 38px;gap:2px 8px;align-items:center;font-size:12px}
.tbars .tr{height:7px;border-radius:2px;background:var(--inset);position:relative}
.tbars .tr i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--accent)}
.tbars span:last-child{text-align:right;font:11px var(--mono);color:var(--muted)}
.srow .d{font:600 12.5px/1 var(--mono)}
.up{color:var(--ok)}.dn{color:var(--no)}
.codebox{grid-column:1/-1}
.codebox textarea{width:100%;height:260px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface-2);font:12px/1.55 var(--mono);padding:10px;resize:vertical}
.foot{font-size:12px;color:var(--muted)}
.foot b{color:var(--ink-2)}

@media (max-width:899px){
  .board{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"blue red" "mid mid";height:auto}
  .picks{grid-template-rows:none}
  .mid{height:min(78vh,640px)}
  .below{grid-template-columns:minmax(0,1fr)}
  .pslot{grid-template-columns:22px 36px minmax(0,1fr);min-height:46px;gap:6px}
  .rl svg{width:14px;height:14px}
  .pslot .ph{width:36px;height:36px}
  .bslot{width:26px;height:26px}.bans{gap:3px}.bans .gap{width:3px}
  .sep{display:none}
}
@media (max-width:420px){
  .team{padding:8px}
  .bslot{width:22px;height:22px}.bans{gap:2px}.bans .gap{width:2px}
  .pslot .nm b{font-size:12.5px}
  .pslot{grid-template-columns:18px 30px minmax(0,1fr);gap:4px;padding:4px}
  .pslot .ph{width:30px;height:30px}
  .rl span{display:none}
  .row{grid-template-columns:minmax(0,1fr)}
}
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5 17.4 5.75v8.5L10 18.5 2.6 14.25v-8.5Z" fill="none" stroke="var(--accent)" stroke-width="1.6"/><path d="M6.5 12.5 10 5.5l3.5 7" fill="none" stroke="var(--gold)" stroke-width="1.6" stroke-linejoin="round"/></svg>Rift Logic <span>Draft</span></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Draft mode"><button type="button" id="m-pro" aria-pressed="true">Pro</button><button type="button" id="m-solo" aria-pressed="false">Solo queue</button></div>
      <button type="button" class="btn" id="fearless" aria-pressed="false" title="Champions picked in earlier games of the series are unavailable">Fearless</button>
      <button type="button" class="btn" id="nextgame" hidden>Next game</button>
      <button type="button" class="btn" id="timerbtn" aria-pressed="false" title="30 s per turn; an expired ban is skipped">Timer</button>
      <span class="sep"></span>
      <button type="button" class="btn ghost" id="undo" title="Undo (Ctrl/⌘ Z)">Undo</button>
      <button type="button" class="btn ghost" id="swap" title="Swap blue and red">Swap</button>
      <button type="button" class="btn ghost" id="reset">Reset</button>
      <span class="sep"></span>
      <button type="button" class="btn" id="copy">Copy code</button>
      <button type="button" class="btn primary" id="open">Open in Rift Logic</button>
      <a class="btn ghost" href="index.html">Editor</a>
      <a class="btn ghost" href="docs.html">Docs</a>
    </div>
  </header>
  <div id="status" role="status" aria-live="polite"></div>

  <main class="board">
    <section class="team B" id="team-B" aria-label="Blue side"></section>
    <section class="mid">
      <div class="turn" id="turn"></div>
      <div class="pool">
        <div class="filters">
          <input type="search" id="q" placeholder="Search  ( / )" aria-label="Search champions" autocomplete="off">
          <div class="seg" role="group" aria-label="Role" id="rolef"></div>
          <div class="pips" role="group" aria-label="LS colour" id="colf"></div>
        </div>
        <div class="grid" id="grid" role="list"></div>
      </div>
    </section>
    <section class="team R" id="team-R" aria-label="Red side"></section>
  </main>

  <section class="below">
    <div class="card sug" id="sug"></div>
    <div class="card B" id="an-B"></div>
    <div class="card R" id="an-R"></div>
    <div class="card codebox" id="codebox" hidden>
      <h3>Rift Logic program <small>select all and copy</small></h3>
      <textarea id="code" readonly spellcheck="false" aria-label="Generated Rift Logic program"></textarea>
    </div>
  </section>
  <p class="foot" id="foot"></p>
</div>

<script>
(() => {

/* ---------- team themes (heuristic): LS colour profile + archetype mix of the locked picks ---------- */
const ARCH = D.arch, K = D.shrink;
const CONF_TIP = "Confidence = √(picks ÷ 5) × (0.4 + 0.6 × separation), where separation = (leading share − runner-up share) ÷ leading share. " +
  "Computed for the LS colour profile (labelled picks only) and for the archetype mix, then averaged. Archetype mixes are a heuristic from ability tags, CC, ranges, classes and the scaling hint.";
const COLNAME = Object.fromEntries(COLS);
function profileConf(v, n){
  const s = v.map((x, j) => [x, j]).sort((a, b) => b[0] - a[0]);
  if (!n || s[0][0] <= 0) return {dom: null, conf: 0, share: 0};
  const sep = (s[0][0] - s[1][0]) / s[0][0];
  return {dom: s[0][1], conf: Math.sqrt(n / 5) * (0.4 + 0.6 * sep), share: s[0][0]};
}
function themeOf(side){
  const cs = picksOf(side).map(k => C[S.fill[k]]), lab = cs.filter(c => c.col);
  const col = COLS.map(([k]) => lab.reduce((a, c) => a + (c.col[k] || 0), 0) / (lab.length || 1));
  const arch = ARCH.map((_, j) => cs.reduce((a, c) => a + c.arch[j], 0) / (cs.length || 1));
  const pc = profileConf(col, lab.length), pa = profileConf(arch, cs.length);
  return {n: cs.length, nl: lab.length, col, arch, dc: pc.dom, da: pa.dom, cc: pc.conf, ca: pa.conf, conf: cs.length ? (pc.conf + pa.conf) / 2 : 0};
}
const cap = x => x[0].toUpperCase() + x.slice(1);
const archLabel = a => a === "pick" ? "pick comp" : a;   // "Pick" alone reads like the draft phase
const themeName = T => T.n ? `${cap(archLabel(ARCH[T.da]))}${T.dc != null ? ` (${COLNAME[COLS[T.dc][0]]})` : ""}` : "—";
// shrunk win-rate difference of champion c in games where a team had theme j (table: vc/va = enemy colour/archetype, wc/wa = allies')
function dth(c, tab, j){
  if (j == null || !c.th) return {d: 0, n: 0};
  const [n, w] = c.th[tab][j];
  return {d: (w - n * c.wr) / (n + K), n};
}
// theme term: colour and archetype parts weighted by their confidences
function themeTerm(c, T, tc, ta){
  const a = dth(c, tc, T.dc), b = dth(c, ta, T.da), wa = T.cc, wb = T.ca;
  if (!(wa + wb)) return {d: 0, n: 0};
  return {d: (wa * a.d + wb * b.d) / (wa + wb), n: Math.max(a.n, b.n)};
}
function pairTerm(c, ids){
  let n = 0, w = 0;
  for (const e of ids){ const p = VS[c.i].get(e); if (p){ n += p[0]; w += p[1]; } }
  return {d: n ? (w - n * c.wr) / (n + K) : 0, n};
}
const sgn = (x, d = 1) => `${x >= 0 ? "+" : "−"}${Math.abs(100 * x).toFixed(d)}`;
const prior = c => (c.w + 75) / (c.g + 150) - 0.5;
// pick score = conf(enemy) × counters-enemy-theme + (1 − conf(enemy)) × counters-enemy-picks + 0.5 × conf(own) × fits-own-theme + 0.25 × own win rate
function pickScores(side){
  const other = side === "B" ? "R" : "B", E = themeOf(other), O = themeOf(side), ids = picksOf(other).map(k => S.fill[k]);
  const roles = openRoles(side);
  return C.filter(c => available(c.i) && S.fill.indexOf(c.i) < 0 && c.g >= 200 && roles.some(r => c.share[r] >= 0.12)).map(c => {
    const a = themeTerm(c, E, "vc", "va"), b = pairTerm(c, ids), f = themeTerm(c, O, "wc", "wa");
    const parts = {theme: E.conf * a.d, pair: (1 - E.conf) * b.d, fit: 0.5 * O.conf * f.d, base: 0.25 * prior(c)};
    const why = [];
    if (E.n) why.push(`vs ${themeName(E)} ${sgn(a.d)} (n ${fmtN(a.n)})`);
    if (b.n) why.push(`vs picks ${sgn(b.d)} (n ${fmtN(b.n)})`);
    if (O.n) why.push(`with your ${themeName(O)} ${sgn(f.d)} (n ${fmtN(f.n)})`);
    if (!why.length) why.push(`win rate ${pct(c.wr, 1)} (n ${fmtN(c.g)})`);
    const role = roles.slice().sort((p, q) => c.share[q] - c.share[p])[0];
    return {c, score: parts.theme + parts.pair + parts.fit + parts.base, parts, why: why.join(" · "), role};
  }).sort((x, y) => y.score - x.score);
}
// ban score = conf(enemy) × (fit to enemy theme × 4 pp + win rate with that theme) + conf(own) × counters-own-theme + (1 − conf(own)) × counters-own-picks + 0.25 × win rate
function banScores(side){
  const other = side === "B" ? "R" : "B", E = themeOf(other), O = themeOf(side), mine = picksOf(side).map(k => S.fill[k]);
  const roles = E.n ? openRoles(other) : [0, 1, 2, 3, 4];
  return C.filter(c => available(c.i) && S.fill.indexOf(c.i) < 0 && c.g >= 200 && roles.some(r => c.share[r] >= 0.12)).map(c => {
    const fit = E.n ? ((E.dc != null ? E.cc * ((c.col && c.col[COLS[E.dc][0]]) || 0) : 0) + E.ca * c.arch[E.da]) / ((E.dc != null ? E.cc : 0) + E.ca || 1) : 0;
    const w = themeTerm(c, E, "wc", "wa"), v = themeTerm(c, O, "vc", "va"), b = pairTerm(c, mine);
    const parts = {complete: E.conf * (0.04 * fit + w.d), counter: O.conf * v.d, pair: (1 - O.conf) * b.d, base: 0.25 * prior(c)};
    const why = [];
    if (E.n) why.push(`fits their ${themeName(E)} ${pct(fit)} · ${sgn(w.d)} with it (n ${fmtN(w.n)})`);
    if (O.n) why.push(`vs your ${themeName(O)} ${sgn(v.d)} (n ${fmtN(v.n)})`);
    if (b.n && !O.n) why.push(`vs your picks ${sgn(b.d)} (n ${fmtN(b.n)})`);
    if (!why.length) why.push(`win rate ${pct(c.wr, 1)} (n ${fmtN(c.g)})`);
    return {c, score: parts.complete + parts.counter + parts.pair + parts.base, parts, why: why.join(" · ")};
  }).sort((x, y) => y.score - x.score);
}

/* ---------- analysis ---------- */
const HARD = new Set(["stun","knockup","knockback","root","pull","fear","suppress","charm","polymorph","taunt","sleep","berserk"]);
const TOOLGROUPS = [
  ["Engage", ["dash","blink","pull","knockup","global"]],
  ["Disengage", ["knockback","speedup","terrain"]],
  ["Protect", ["shield","heal","ally_buff","damage_reduction"]],
  ["Evade", ["untargetable","invuln","stasis","stealth"]]];
function team(side){ return S.order[side].map((k, p) => has(k) ? {k, c: C[S.fill[k]], r: p} : null).filter(Boolean); }
function analysis(side){
  const T = team(side), box = $("an-" + side);
  const head = h("h3", {}, `${SIDE[side]} comp`, h("small", {}, T.length ? `${T.length}/5 picked` : ""));
  if (!T.length){ box.replaceChildren(head, h("p", {class: "why"}, "No picks yet.")); return; }
  const rows = [], TH = themeOf(side);
  const ar = ARCH.map((n, j) => [n, TH.arch[j]]).sort((a, b) => b[1] - a[1]);
  rows.push(["Theme", [h("div", {title: CONF_TIP}, h("b", {}, themeName(TH)), h("span", {class: "why"}, ` · confidence ${pct(TH.conf)} (${TH.n}/5)`)),
    h("div", {class: "tbars"}, ar.flatMap(([n, v]) => [h("span", {}, archLabel(n)), h("div", {class: "tr"}, h("i", {style: `width:${Math.min(100, 200 * v)}%`})), h("span", {}, pct(v))])),
    h("div", {class: "why"}, "Archetype mix is a heuristic from ability tags, CC, ranges, classes and the scaling hint.")]]);
  // LS colours (labels/ls_colors.csv): each labelled champion's weights sum to 1
  const lab = T.filter(x => x.c.col), cw = {};
  for (const x of lab) for (const [k, v] of Object.entries(x.c.col)) cw[k] = (cw[k] || 0) + v / lab.length;
  const colSorted = COLS.filter(([k]) => cw[k] > 0).sort((a, b) => cw[b[0]] - cw[a[0]]);
  rows.push(["Colours", lab.length ? [
    h("div", {class: "stack"}, colSorted.map(([k, n]) => h("i", {style: `width:${100 * cw[k]}%;background:var(--m${k})`, title: `${n} ${pct(cw[k])}`}))),
    h("div", {class: "legend"}, colSorted.map(([k, n]) => h("span", {}, h("i", {class: "dot", style: `background:var(--m${k})`}), `${n} ${pct(cw[k])}`)),
      lab.length < T.length ? h("span", {class: "why"}, `${T.length - lab.length} unlabelled`) : null)] : [h("span", {class: "why"}, "No LS labels for these champions.")]]);
  // damage split: average damage to champions per game in ranked solo
  const dm = [0, 0, 0]; let dn = 0;
  for (const x of T) if (x.c.dmg && x.c.g){ x.c.dmg.forEach((v, j) => dm[j] += v / x.c.g); dn++; }
  const dt = dm[0] + dm[1] + dm[2] || 1;
  rows.push(["Damage", [
    h("div", {class: "stack"}, [["phys", "AD"], ["magic", "AP"], ["true", "True"]].map(([v, n], j) => h("i", {style: `width:${100 * dm[j] / dt}%;background:var(--${v})`, title: `${n} ${pct(dm[j] / dt)}`}))),
    h("div", {class: "legend"}, [["phys", "AD"], ["magic", "AP"], ["true", "True"]].map(([v, n], j) => h("span", {}, h("i", {class: "dot", style: `background:var(--${v})`}), `${n} ${pct(dm[j] / dt)}`)),
      h("span", {class: "why"}, `≈ ${fmtN(Math.round(dt))} to champions / game`))]]);
  // crowd control (calc.json, the data fight() uses); durations at max rank
  const cc = {}; let hardSec = 0, hardN = 0, soft = 0;
  for (const x of T) for (const [slot, type, dur] of x.c.cc){
    (cc[type] = cc[type] || []).push(`${x.c.name} ${slot}${dur ? ` ${dur}s` : ""}`);
    if (HARD.has(type)){ hardN++; hardSec += dur || 0; } else soft++;
  }
  const ccTypes = Object.keys(cc).sort((a, b) => HARD.has(b) - HARD.has(a) || cc[b].length - cc[a].length);
  rows.push(["CC", [h("div", {}, h("b", {}, hardN), " hard", hardSec ? h("span", {class: "why"}, ` (${hardSec.toFixed(1)} s summed, max rank)`) : null, " · ", h("b", {}, soft), " soft"),
    h("div", {class: "chips"}, ccTypes.map(t => h("span", {class: "chip" + (HARD.has(t) ? " hard" : ""), title: cc[t].join("\n")}, t, h("b", {}, "×" + cc[t].length))))]]);
  // tools: kb.json ability tags, grouped (the grouping is a heuristic)
  const tl = TOOLGROUPS.map(([g, tags]) => {
    const who = [];
    for (const x of T) for (const t of tags) if (x.c.tools[t]) who.push([x.c.name, x.c.tools[t].join(""), t]);
    return [g, who];
  });
  rows.push(["Tools", tl.map(([g, who]) => h("div", {class: "chips"}, h("span", {class: "why", style: "min-width:68px"}, g), who.length ? who.map(([n, s, t]) => h("span", {class: "chip", title: t}, n, h("b", {}, s), h("span", {class: "why"}, t.replace("_", " ")))) : h("span", {class: "why"}, "—")))]);
  // range: attack range and longest non-global ability range (kb.json)
  const rr = T.map(x => { const ab = x.c.rng.filter(([, r]) => r <= 2500).sort((a, b) => b[1] - a[1])[0]; return {n: x.c.name, ar: x.c.ar, ab}; });
  const maxR = Math.max(1200, ...rr.map(x => Math.max(x.ar, x.ab ? x.ab[1] : 0)));
  const melee = rr.filter(x => x.ar < 300).length;
  rows.push(["Range", [h("div", {class: "why"}, `${melee} melee · ${rr.length - melee} ranged · bar = longest ability, dark = attack range`),
    h("div", {class: "rng"}, rr.flatMap(x => [h("span", {}, x.n), h("div", {class: "tr"}, x.ab ? h("i", {style: `width:${100 * x.ab[1] / maxR}%`}) : null, h("u", {style: `width:${100 * x.ar / maxR}%`})),
      h("span", {}, x.ab ? `${x.ab[0]} ${x.ab[1]}` : x.ar)]))]]);
  // scaling: ranked-solo win rate in games ≥ 32 min minus games < 25 min (confounded by game state)
  const sc = T.filter(x => x.c.dur[0] >= 100 && x.c.dur[2] >= 100).map(x => ({n: x.c.name, d: x.c.dur[3] / x.c.dur[2] - x.c.dur[1] / x.c.dur[0]}));
  if (sc.length){
    const avg = sc.reduce((a, x) => a + x.d, 0) / sc.length;
    sc.sort((a, b) => b.d - a.d);
    rows.push(["Scaling", [h("div", {}, h("b", {class: avg >= 0 ? "up" : "dn"}, `${avg >= 0 ? "+" : ""}${(100 * avg).toFixed(1)} pp`), avg > 0.015 ? " late-leaning" : avg < -0.015 ? " early-leaning" : " even",
      h("span", {class: "why"}, ` · most late: ${sc[0].n} (${(100 * sc[0].d).toFixed(1)}), most early: ${sc[sc.length - 1].n} (${(100 * sc[sc.length - 1].d).toFixed(1)})`)),
      h("div", {class: "why"}, "Solo-queue win rate in ≥ 32 min games minus < 25 min games, averaged. A hint, not a measurement: long games are not a random sample.")]]);
  }
  const wr = T.reduce((a, x) => a + x.c.wr, 0) / T.length;
  rows.push(["Win rate", [h("div", {}, h("b", {}, pct(wr, 1)), h("span", {class: "why"}, ` average solo-queue win rate of the picks (${T.map(x => `${x.c.name} ${pct(x.c.wr, 1)}, n ${fmtN(x.c.g)}`).join(" · ")})`))]]);
  box.replaceChildren(head, ...rows.map(([l, v]) => h("div", {class: "row"}, h("label", {}, l), h("div", {class: "v"}, v))));
}

/* ---------- suggestions: theme-aware, from ranked solo games ---------- */
function suggest(){
  const box = $("sug"), k = current();
  if (k == null){ box.replaceChildren(h("h3", {}, "Suggestions"), h("p", {class: "why"}, "Draft complete. Open it in Rift Logic to run the fight.")); return; }
  const a = seq()[k], side = a.s, other = side === "B" ? "R" : "B", E = themeOf(other), O = themeOf(side);
  const rows = (a.t === "pick" ? pickScores(side) : banScores(side)).slice(0, 8);
  const note = a.t === "pick"
    ? `Score = enemy-theme confidence × win rate vs teams of that theme + (1 − confidence) × win rate vs the enemy picks + ½ × own-theme confidence × win rate with allies of your theme + ¼ × own win rate. All from ${fmtN(D.themeGames)} ranked solo games, as differences from each champion's own win rate, shrunk by ${K} games. Open roles only.`
    : `Score = enemy-theme confidence × (how well it fits their theme × 4 pp + its win rate with that theme) + own-theme confidence × its win rate vs your theme + ¼ × own win rate. Differences from each champion's own win rate in ${fmtN(D.themeGames)} ranked solo games, shrunk by ${K} games.`;
  box.replaceChildren(
    h("h3", {}, `${a.t === "pick" ? "Pick" : "Ban"} ideas for ${SIDE[side]}`,
      h("small", {title: CONF_TIP}, E.n ? `${SIDE[other]}: ${themeName(E)} · confidence ${pct(E.conf)} (${E.n}/5)` : "data-driven, solo queue")),
    rows.length ? h("div", {class: "sgrid"}, rows.map(x => h("button", {type: "button", class: "srow", onclick: () => choose(x.c.i),
      title: `${x.why}\nscore parts: ${Object.entries(x.parts).map(([p, v]) => `${p} ${sgn(v, 2)}`).join(", ")} pp`},
      h("div", {class: "ph"}, portrait(x.c)),
      h("div", {}, h("b", {}, x.c.name, x.role != null ? h("span", {class: "why"}, ` · ${POS[x.role]}`) : null), h("small", {class: "rs"}, x.why)),
      h("span", {class: "d " + (x.score >= 0 ? "up" : "dn")}, sgn(x.score))))) : h("p", {class: "why"}, "Not enough data for any available champion."),
    h("p", {class: "why", style: "margin:8px 0 0", title: CONF_TIP}, note));
}

/* ---------- Rift Logic program ---------- */
const LEVEL = [14, 13, 14, 13, 11];
function body(side){
  const T = team(side);
  return T.map((x, i) => {
    const r = x.r ?? 0, its = x.c.items;
    const code = `    ${x.c.id}(${LEVEL[r]})${its.length ? `.with(${its.join(", ")})` : ""}${i < T.length - 1 ? "," : ""}`;
    const note = its.length ? `${POS[r].toLowerCase()}; items in ${x.c.itemsN.map(fmtN).join(" / ")} of ${fmtN(x.c.g)} games` : `${POS[r].toLowerCase()}; no item data: add .with(...)`;
    return code.padEnd(56) + " // " + note;
  }).join("\n");
}
function program(){
  return `// Mock draft${S.fearless ? ` (fearless, game ${S.game})` : ""} from Rift Logic Draft.
// Levels are rough 25-minute levels (support 11). Items: each champion's 2 most common finished
// legendary items in ${fmtN(D.games)} ranked solo games — edit freely.
TeamComp blue = {
${body("B")}
};
TeamComp red = {
${body("R")}
};

// A 25-second fight with the front lines 600 units apart, run in both side orders.
print(fight(blue, red, 25, start: 600));
print(fight(red, blue, 25, start: 600));
`;
}
function draftName(){
  const names = s => team(s).map(x => x.c.name).join(" ");
  let base = `Draft: ${names("B")} vs ${names("R")}`;
  if (base.length > 60) base = base.slice(0, 58) + "…";
  return base;
}
function openInEditor(){
  if (!team("B").length || !team("R").length){ status("Pick at least one champion on each side."); return; }
  const code = program();
  if (!STANDALONE){ copyCode(true); return; }
  let drafts = {};
  try { drafts = JSON.parse(localStorage.getItem("riftlogic.drafts") || "{}") || {}; } catch (_) {}
  let name = draftName(), i = 2; const base = name;
  while (drafts[name] !== undefined && drafts[name] !== code && i < 99) name = `${base} (${i++})`;
  drafts[name] = code;
  try {
    localStorage.setItem("riftlogic.drafts", JSON.stringify(drafts));
    localStorage.setItem("riftlogic.current", JSON.stringify({draft: name}));
  } catch (_) { copyCode(true); return; }
  location.href = "index.html";
}
function showCode(code){ const box = $("codebox"), ta = $("code"); ta.value = code; box.hidden = false; ta.focus(); ta.select(); }
function copyCode(forEditor){
  if (!team("B").length && !team("R").length){ status("Nothing drafted yet."); return; }
  const code = program(), msg = forEditor ? "Code copied — paste it into the Rift Logic editor." : "Rift Logic program copied.";
  const fallback = () => { showCode(code); status("Copy blocked here: the program is selected below — press Ctrl/⌘ C."); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(() => status(msg, true), fallback);
    else fallback();
  } catch (_) { fallback(); }
}

/* ---------- render ---------- */
function render(){
  renderTeam("B"); renderTeam("R"); renderTurn(); renderGrid(); analysis("B"); analysis("R"); suggest();
  $("m-pro").setAttribute("aria-pressed", String(S.mode === "pro")); $("m-solo").setAttribute("aria-pressed", String(S.mode === "solo"));
  $("fearless").setAttribute("aria-pressed", String(S.fearless)); $("fearless").textContent = S.fearless ? `Fearless · G${S.game}` : "Fearless";
  $("nextgame").hidden = !S.fearless;
  $("timerbtn").setAttribute("aria-pressed", String(S.timer));
  $("undo").disabled = !hist.length;
  const ready = team("B").length && team("R").length;
  $("open").disabled = !ready;
  if (!$("codebox").hidden) $("code").value = program();
}
$("m-pro").addEventListener("click", () => setMode("pro"));
$("m-solo").addEventListener("click", () => setMode("solo"));
$("fearless").addEventListener("click", () => { snap(); S.fearless = !S.fearless; if (!S.fearless){ S.locked = []; S.game = 1; } commit(); });
$("nextgame").addEventListener("click", nextGame);
$("timerbtn").addEventListener("click", () => { S.timer = !S.timer; turnStart = Date.now(); commit(); });
$("undo").addEventListener("click", undo);
$("swap").addEventListener("click", swapSides);
$("reset").addEventListener("click", reset);
$("copy").addEventListener("click", () => copyCode(false));
$("open").addEventListener("click", openInEditor);
document.addEventListener("keydown", e => {
  const inField = e.target.closest && e.target.closest("input,textarea,select");
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !inField){ e.preventDefault(); undo(); }
  else if (e.key === "/" && !inField){ e.preventDefault(); $("q").focus(); }
  else if (e.key === "Escape" && target != null){ target = null; render(); }
});
$("foot").append(h("b", {}, "Data. "), `Portraits: Data Dragon. Positions, damage split, items, win rates: ${fmtN(D.games)} ranked solo games (patch ${Object.keys(D.versions).join(", ")}). Crowd control: the engine's calc.json (max-rank durations). Tools and ranges: kb.json ability tags and ranges (patch ${D.patch}). Colours: LS labels. Themes: LS colour weights plus a heuristic archetype mix; theme win rates from ${fmtN(D.themeGames)} ranked solo games. Tool grouping, archetypes, scaling and the suggestion weights are heuristics.`);
render();
window.__draft = {get state(){ return S; }, choose, undo, swapSides, nextGame, skipBan, moveSlot, sortByRole, pickScores, banScores, themeOf, themeName, program, reset, setMode, byId: id => C.findIndex(c => c.id === id)};
})();
</script>
