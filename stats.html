<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>[hidden]{display:none!important}</style></head><body>
<title>Rift Logic Stats</title>
<meta name="description" content="Champion win rates, win probability added (WPA) and matchups from ranked solo queue and pro play, with confidence intervals.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#07080A; --surface:#0E1014; --surface-2:#13161B; --inset:#1A1E24;
  --ink:#E6E9ED; --ink-2:#B3BAC3; --muted:#8A939E; --faint:#5A626C; --line:#1F242B; --line-strong:#2C323B;
  --accent:#3FB7B4; --accent-ink:#04201F; --accent-soft:#123135;
  --gold:#D4AF63; --ok:#4CC287; --no:#F07580; --warn:#E5AE5A;
  --side1:#5B93E8; --side2:#E26B5F;
  --shadow:0 16px 40px rgba(0,0,0,.65);
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#EFF2F5; --surface:#FFFFFF; --surface-2:#F6F8FA; --inset:#E9EDF1;
  --ink:#121A23; --ink-2:#36424F; --muted:#5F6B79; --faint:#8C97A3; --line:#DCE2E8; --line-strong:#C4CCD5;
  --accent:#0B6E78; --accent-ink:#FFFFFF; --accent-soft:#DDEFF0;
  --gold:#8A6516; --ok:#1C7A48; --no:#B42F3E; --warn:#935800;
  --side1:#2F6FD0; --side2:#C4453A;
  --shadow:0 12px 32px rgba(18,26,35,.16);
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);padding-inline:16px;padding-block:0 40px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td,.big{font-variant-numeric:tabular-nums}
.app{max-width:1240px;margin:0 auto;display:grid;gap:14px;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-block:10px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font:600 15.5px/1 var(--sans);min-width:0;text-decoration:none;color:var(--ink)}
.brand svg{width:18px;height:18px;flex:none}
.brand span{color:var(--muted);font-weight:500}
.nav{display:flex;flex-wrap:wrap;gap:2px;margin-right:auto}
.nav a{padding:6px 9px;border-radius:6px;color:var(--ink-2);text-decoration:none;font:500 13px/1 var(--sans)}
.nav a:hover{background:var(--inset)}
.nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.nav .ext{color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:6px 11px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:500 13px/1 var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--inset)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 10px;min-height:30px;font:500 12.5px/1 var(--sans);cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.4;cursor:default}
select,input[type=search],input[type=number]{height:32px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface-2);padding:0 8px;font-size:13px;min-width:0}
input[type=search]{flex:1 1 160px;padding:0 10px}
label.f{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--sans);color:var(--muted)}

/* layout */
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.head h1{margin:0;font:600 22px/1.15 var(--sans)}
.head .sub{color:var(--muted);font-size:13px}
.head .grow{flex:1}
.ph{width:32px;height:32px;border-radius:5px;overflow:hidden;background:var(--inset);flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.ph img{display:block;width:100%;height:100%}
.ph .mono{display:grid;place-items:center;width:100%;height:100%;font:600 12px/1 var(--sans);color:#fff}
.ph.lg{width:56px;height:56px;border-radius:8px}
.ph.lg .mono{font-size:18px}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.note{color:var(--muted);font-size:12.5px;margin:0}
.lede{margin:0;font-size:15px;line-height:1.5;max-width:900px}
.lede b{font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.card h3,.sec h2{margin:0 0 8px;font:600 11.5px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .big{font:600 26px/1.1 var(--sans);letter-spacing:-.01em}
.card .ci{color:var(--muted);font-size:12px;margin-top:2px}
.card .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;margin-top:6px}
.card .kv span:nth-child(odd){color:var(--muted)}
.card .kv span:nth-child(even){text-align:right;font-family:var(--mono);font-size:12.5px}
.sec{display:grid;gap:8px;min-width:0}
.sec h2{font-size:12px;margin:6px 0 0;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.sec h2 small{letter-spacing:0;text-transform:none;font-weight:400;color:var(--faint);font-size:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.up{color:var(--ok)}.dn{color:var(--no)}
.tl{color:var(--faint);font-style:italic;font-size:12px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.loading i{display:inline-block;width:18px;height:18px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-4px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.loading i{animation:none}}
.err{border-color:var(--no);color:var(--no)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:100%;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
caption{text-align:left;padding:8px 10px;color:var(--muted);font-size:12px;caption-side:bottom;border-top:1px solid var(--line)}
th,td{padding:6px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
thead th{position:sticky;top:0;background:var(--surface-2);font:600 11.5px/1.2 var(--sans);color:var(--muted);letter-spacing:.02em;z-index:1}
thead th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:3px;border-radius:3px}
thead th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
thead th button::after{content:"";width:8px;font-size:9px;color:var(--faint)}
thead th[aria-sort="descending"] button::after{content:"▼";color:var(--accent)}
thead th[aria-sort="ascending"] button::after{content:"▲";color:var(--accent)}
thead th[aria-sort="descending"],thead th[aria-sort="ascending"]{color:var(--ink)}
th.l,td.l{text-align:left}
tbody th{text-align:left;font-weight:500}
tbody th a{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
tbody th a:hover b{color:var(--accent);text-decoration:underline}
tbody th .ph{width:26px;height:26px;border-radius:4px}
tbody th small{color:var(--muted);font-weight:400;margin-left:2px}
tbody tr:hover{background:var(--surface-2)}
tr.small td,tr.small th{opacity:.5}
td.rk{color:var(--faint);font-size:12px;width:2.5em}
td small{color:var(--muted);font-size:11px;margin-left:5px}
.cib{display:inline-block;position:relative;width:54px;height:6px;border-radius:3px;background:var(--inset);vertical-align:middle;margin-left:8px}
.cib i{position:absolute;top:0;bottom:0;border-radius:3px;background:color-mix(in srgb,var(--accent) 55%,transparent)}
.cib u{position:absolute;top:-2px;bottom:-2px;width:1px;left:50%;background:var(--faint)}
.more{display:flex;justify-content:center;padding:6px}
.gcol{background:color-mix(in srgb,var(--accent) 5%,transparent)}

/* bars */
.split{display:grid;grid-template-columns:52px minmax(0,1fr) 64px;gap:4px 8px;align-items:center;font-size:12.5px;margin-top:8px}
.split .tr{position:relative;height:8px;background:var(--inset);border-radius:2px}
.split .tr u{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line-strong)}
.split .tr i{position:absolute;top:0;bottom:0;border-radius:2px}
.split .tr i.p{background:var(--ok)}.split .tr i.n{background:var(--no)}
.split span:first-child{color:var(--muted)}
.split span:last-child{text-align:right;font-family:var(--mono);font-size:12px}

.soon{border-style:dashed;color:var(--muted)}
.codebox textarea{width:100%;height:220px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface-2);font:12px/1.55 var(--mono);padding:10px;resize:vertical}
.prose{max-width:860px;display:grid;gap:10px}
.prose p,.prose li{line-height:1.55}
.prose h2{margin:12px 0 0;font:600 16px/1.3 var(--sans)}
.prose ul{margin:0;padding-left:20px}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
#status{font:12px/1.3 var(--sans);color:var(--ok);min-height:1em}

/* selector bar: champion search, role tabs, pro / solo, dataset */
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;padding-top:2px}
.cb{position:relative;flex:0 1 260px;min-width:0}
.cb input{width:100%;height:34px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface-2);padding:0 30px 0 32px;font-size:13.5px}
.cb input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.cb .mag{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted);pointer-events:none}
.cb kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:500 11px/1 var(--mono);color:var(--faint);border:1px solid var(--line-strong);border-radius:4px;padding:2px 5px;pointer-events:none}
.cb input:focus ~ kbd{display:none}
.cb-list{position:absolute;z-index:50;left:0;right:0;top:calc(100% + 4px);min-width:240px;max-height:min(360px,60vh);overflow-y:auto;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow)}
.cb-list li{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:5px;cursor:pointer;font-size:13px}
.cb-list li .ph{width:24px;height:24px;border-radius:4px}
.cb-list li small{margin-left:auto;color:var(--muted);font-size:11.5px;white-space:nowrap}
.cb-list li[aria-selected="true"]{background:var(--accent-soft);color:var(--ink)}
.cb-list li.none{color:var(--muted);cursor:default}
.rtabs{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--surface)}
.rtabs button{display:inline-flex;align-items:center;gap:5px;border:0;background:none;padding:0 9px;height:32px;font:500 12.5px/1 var(--sans);cursor:pointer;color:var(--ink-2)}
.rtabs button + button{border-left:1px solid var(--line)}
.rtabs button svg{width:17px;height:17px;fill:currentColor;flex:none}
.rtabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rtabs button:disabled{opacity:.4;cursor:default}
.dsf{display:flex;flex-wrap:wrap;gap:6px}
.dsf select{max-width:190px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12.5px;color:var(--muted);min-height:22px}
.crumbs ol{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0;padding:0;list-style:none}
.crumbs li + li::before{content:"›";margin-right:4px;color:var(--faint)}
.crumbs a{color:var(--ink-2);text-decoration:none}.crumbs a:hover{color:var(--accent);text-decoration:underline}
.crumbs [aria-current]{color:var(--ink);font-weight:500}
.recent{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-left:auto}
.recent a{display:inline-flex;align-items:center;gap:5px;padding:2px 7px 2px 2px;border:1px solid var(--line);border-radius:14px;color:var(--ink-2);text-decoration:none;font-size:12px;background:var(--surface)}
.recent a:hover{border-color:var(--accent)}
.recent .ph{width:20px;height:20px;border-radius:50%}

/* champion tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:9px 12px;color:var(--ink-2);text-decoration:none;font:500 13.5px/1 var(--sans);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs a .pill{font:500 10px/1 var(--sans);color:var(--faint);margin-left:5px;text-transform:uppercase;letter-spacing:.04em}
.notice{background:var(--surface);border:1px dashed var(--line-strong);border-radius:8px;padding:14px;display:grid;gap:8px;max-width:760px}
.notice b{font-weight:600}
.more-link{font-size:12.5px;text-decoration:none}.more-link:hover{text-decoration:underline}

/* tier list: one band per tier (S..D), best first left to right */
.tiers{display:grid;gap:6px}
.band{display:grid;grid-template-columns:64px minmax(0,1fr);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:8px;background:var(--surface-2);min-width:0}
.band .bh{display:grid;align-content:center;justify-items:center;gap:3px;padding:8px 4px;border-right:1px solid var(--line);text-align:center}
.band .bh h3{margin:0;font:700 22px/1 var(--sans);color:var(--tc)}
.band .bh small{font-size:10.5px;color:var(--muted);line-height:1.2}
.band .grid{padding:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.tile{position:relative;display:grid;justify-items:center;gap:2px;padding:8px 4px 7px;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);min-width:0;border-top:3px solid var(--tc,var(--line-strong))}
.tile:hover{border-color:var(--accent);border-top-color:var(--tc,var(--accent))}
.tile .ph{width:44px;height:44px;border-radius:6px}
.tile b{font:500 12px/1.2 var(--sans);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .wr{font:600 13px/1.1 var(--mono)}
.tile small{font-size:10.5px;color:var(--muted)}
.tile .tb{position:absolute;top:5px;left:6px;font:700 10px/1 var(--mono);color:var(--tc)}
.tile .ri{position:absolute;top:4px;right:5px;width:14px;height:14px;color:var(--muted)}
.tile .ri svg{width:14px;height:14px;fill:currentColor;display:block}
.tile.small{opacity:.45;border-top-color:var(--line-strong)}
.t-S{--tc:#E4B94F}.t-A{--tc:var(--ok)}.t-B{--tc:var(--accent)}.t-C{--tc:var(--muted)}.t-D{--tc:var(--no)}
:root[data-theme="light"] .t-S{--tc:#A07310}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--tc);margin-right:4px;vertical-align:-1px}
.rsec h2 svg{width:15px;height:15px;fill:currentColor;vertical-align:-3px;margin-right:4px}
details.lowg summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin:4px 0}

/* item / rune icons */
.ic{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:4px;overflow:hidden;background:var(--inset);flex:none;box-shadow:inset 0 0 0 1px var(--line);font:600 9px/1 var(--sans);color:var(--muted);vertical-align:middle}
.ic img{display:block;width:100%;height:100%}
.ic.rn{border-radius:50%;background:transparent;box-shadow:none}
.ic.lg{width:36px;height:36px}
.ilab{display:inline-flex;align-items:center;gap:8px}
.ilab b{font-weight:500}
.core{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.core .card{display:grid;gap:6px}
.core .icons{display:flex;gap:4px;align-items:center}
.core .icons .plus{color:var(--faint);font-size:12px}
.core .nm{font-size:12px;color:var(--ink-2);line-height:1.35}
.core .st{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px}
.core .card.small{opacity:.5}
.page{display:inline-flex;align-items:center;gap:3px}
.page .sep{width:1px;height:18px;background:var(--line-strong);margin:0 4px}
.shards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.mucb{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mucb .cb{flex:1 1 220px;max-width:300px}
.vs{font:600 13px/1 var(--sans);color:var(--muted)}
@media (min-width:761px){.bar{position:sticky}}
@media (max-width:760px){
  .bar{position:static}
  .selbar .cb{flex:1 1 100%;max-width:none}
  .rtabs button span{display:none}
  .rtabs button{padding:0 8px}
  .recent{margin-left:0}
  .grid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}
  .band{grid-template-columns:minmax(0,1fr)}
  .band .bh{display:flex;justify-content:flex-start;gap:8px;padding:6px 10px;border-right:0;border-bottom:1px solid var(--line)}
  .band .bh h3{font-size:17px}
  .two{grid-template-columns:minmax(0,1fr)}
  .nav{order:3;width:100%}
  .head h1{font-size:19px}
  .card .big{font-size:22px}
}
</style>
<div class="app">
  <header class="bar">
    <a class="brand" href="#/tier"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5 17.4 5.75v8.5L10 18.5 2.6 14.25v-8.5Z" fill="none" stroke="var(--accent)" stroke-width="1.6"/><path d="M6.5 12.5 10 5.5l3.5 7" fill="none" stroke="var(--gold)" stroke-width="1.6" stroke-linejoin="round"/></svg>Rift Logic <span>Stats</span></a>
    <nav class="nav" id="nav" aria-label="Pages"></nav>
    <div class="tools">
      <button type="button" class="btn ghost" id="theme" aria-label="Switch colour theme">Light</button>
    </div>
    <div class="selbar" role="search" aria-label="Choose champion, role and data">
      <div id="cb-slot" class="cb"></div>
      <div class="rtabs" id="roles" role="group" aria-label="Role"></div>
      <div class="seg" role="group" aria-label="Data source"><button type="button" id="m-pro" aria-pressed="true">Pro</button><button type="button" id="m-solo" aria-pressed="false">Solo queue</button></div>
      <div class="dsf"><select id="year" aria-label="Pro dataset"></select><span id="dsf" class="dsf"></span></div>
    </div>
  </header>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <div id="status" role="status" aria-live="polite"></div>
  <main id="main" tabindex="-1"><div class="loading"><i></i>Loading match data (about 500 KB, fetched once)…</div></main>
  <p class="foot" id="foot"></p>
</div>
<script>

    const Rs = [0, 1, 2, 3, 4].map(rankRole);
    return {k: null, ranked: Rs.flatMap(R => R.ranked).sort((a, b) => a.p - b.p || b.wr.lo - a.wr.lo),

/* ---------- plain-language summary ---------- */
function phaseWords(x, what){
  if (!x.ok) return null;
  const v = pp(x.v, 1);

  return x.lo > 0 ? `gains more after 15 minutes (${v})` : x.hi < 0 ? `gives some back later (${v})` : `after 15 minutes it's about even (${v}, within noise)`;
}
function summary(S, i, r, name){
  const out = [], where = r != null ? ` as ${ROLE_L[r]}` : "";
  if (S.pro){
    const L = avgOf(S, "wpaLane", i, r), T = avgOf(S, "wpaTeam", i, r), W = avgOf(S, "wpa", i, r);
    if (L.ok && T.ok){
      const a = phaseWords(L, "lane"), b = phaseWords(T, "team"), sL = L.lo > 0 ? 1 : L.hi < 0 ? -1 : 0, sT = T.lo > 0 ? 1 : T.hi < 0 ? -1 : 0;
      const join = sL && sT && sL !== sT ? " but " : (sL || sT) && !(sL && sT) ? "; " : " and ";
      let s = `${name}${where} ${a}${join}${b}.`; s = s[0].toUpperCase() + s.slice(1);
      const Dr = avgOf(S, "wpaDraft", i, r);
      if (Dr.ok) s += ` Draft phase: ${pp(Dr.v, 2)} on average${Dr.lo <= 0 && Dr.hi >= 0 ? " (within noise)" : ""}.`;
      out.push(s);
      out.push(W.lo > 0 ? `Net ${pp(W.v)} per game (95% CI ${sgn(W.lo)} to ${sgn(W.hi)}): positive.` : W.hi < 0 ? `Net ${pp(W.v)} per game (95% CI ${sgn(W.lo)} to ${sgn(W.hi)}): negative.` : `Net ${pp(W.v)} per game, not distinguishable from zero (${grp(W.n)} games).`);
    } else out.push(`${name}${where}: too little data for WPA in ${S.name}.`);
  } else {
    const w = champWin(S, i, {role: r});
    if (w.ok) out.push(`${name} wins ${pct(w.v)} of ${grp(w.n)} solo-queue games${where} (95% CI ${pct(w.lo)}–${pct(w.hi)}): ${w.lo > 0.5 ? "above an even game" : w.hi < 0.5 ? "below an even game" : "not distinguishable from 50%"}.`);
    else out.push(`${name}${where}: too little data in ${S.name} (${grp(w.n)} games).`);
  }
  const sh = champWin(S, i, {length: "short"}), lg = champWin(S, i, {length: "long"});
  if (sh.ok && lg.ok){
    const d = lg.v - sh.v, apart = lg.lo > sh.hi || sh.lo > lg.hi;
    if (Math.abs(d) >= 0.03) out.push(`Scaling hint: ${pct(lg.v)} in long games (${ST.long}+ min) vs ${pct(sh.v)} in short ones (under ${ST.short})${apart ? "" : ", though the intervals overlap"}.`);
  }
  return out.join(" ");
}

/* games with vs without (disjoint): difference of two proportions, Newcombe's hybrid Wilson interval */
function diffCI(k1, n1, k2, n2){

  main.append(h("div", {class: "mucb"}, cbA, h("button", {type: "button", class: "btn", id: "swap", disabled: b ? null : true, title: "Swap the two champions", "aria-label": "Swap sides", onclick: () => go2(b, a, ro)}, "⇄ Swap"), cbB));
  main.append(h("div", {class: "filters"},
    roles.length > 1 ? h("div", {class: "seg", role: "group", "aria-label": "Lane"}, roles.map(k => h("button", {type: "button", "aria-pressed": String(ro === k), onclick: () => go(b, k)}, `${ROLE_L[k]} · ${grp(laneGames(POS[b], k))}`))) : null,
    h("span", {class: "note"}, `${S.name} · same lane${ro != null ? ", " + ROLE_L[ro] : ""}`)));
  function go2(x, y, k){ location.hash = link("matchup", [x, y], {...base(c), role: k != null ? ROLES[k] : null}); }
  if (!b){ main.append(h("p", {class: "note"}, `Choose one of ${nameA}'s ${opps.length} lane opponents${rr != null ? " as " + ROLE_L[rr] : ""} with ${D.min}+ games.`)); return; }
  const j = POS[b], nameB = nameOf(b);
  const w = vsWin(S, i, j, ro, true), any = vsWin(S, i, j, null, false);
  const flip = x => x.ok ? {...x, v: 1 - x.v, lo: 1 - x.hi, hi: 1 - x.lo, k: x.n - x.k} : x;
  const cards = h("div", {class: "cards"});
  const wrBig = (x, idd) => x.ok ? h("span", {class: clsCI(x.lo, x.hi, 0.5), id: idd}, pct(x.v)) : h("span", {class: "tl", id: idd}, "too little data");
  cards.append(card(`${nameA} win rate`, wrBig(w, "m-wr"), w.ok ? `95% CI ${pct(w.lo)}–${pct(w.hi)} · ${grp(w.n)} games` : `fewer than ${D.min} games in the same lane (not stored)`));
  const wb = flip(w);
  cards.append(card(`${nameB} win rate`, wrBig(wb, "m-wr2"), w.ok ? `95% CI ${pct(wb.lo)}–${pct(wb.hi)} · the same ${grp(w.n)} games` : null));
  cards.append(card("Any roles, opposite teams", any.ok ? pct(any.v) : h("span", {class: "tl"}, "too little data"), any.ok ? `${nameA}'s win rate · 95% CI ${pct(any.lo)}–${pct(any.hi)} · ${grp(any.n)} games` : null));
  let lede = null;
  if (S.pro){
    const T = vsWpa(S, i, j, ro, 0), L = vsWpa(S, i, j, ro, 1), Tm = vsWpa(S, i, j, ro, 2);
    const neg = x => x.ok ? {...x, v: -x.v, lo: -x.hi, hi: -x.lo} : x;
    const XP = S.phases.slice(3).map((ph, k) => [ph[0].toUpperCase() + ph.slice(1), vsWpa(S, i, j, ro, 3 + k)]);
    cards.append(card(`${nameA} WPA`, T.ok ? h("span", {class: clsCI(T.lo, T.hi, 0), id: "m-wpa"}, pp(T.v)) : h("span", {class: "tl"}, "too little data"), T.ok ? `per game · ${grp(T.n)} games with 15-min data` : null, splitBars([...XP, ["Lane", L], ["Team", Tm]])));
    cards.append(card(`${nameB} WPA`, T.ok ? pp(-T.v) : h("span", {class: "tl"}, "–"), T.ok ? "exactly the opposite: lane opponents' WPA cancels" : null, splitBars([...XP.map(([a, x]) => [a, neg(x)]), ["Lane", neg(L)], ["Team", neg(Tm)]])));
    if (L.ok){
      const base1 = avgOf(S, "wpaLane", i, ro);
      const noise = L.lo <= 0 && L.hi >= 0;
      lede = `In ${grp(L.n)} pro games with ${nameA} against ${nameB}${ro != null ? " in " + ROLE_L[ro].toLowerCase() : " in the same lane"}, ${nameA}'s lane-phase WPA averaged ${pp(L.v, 1)} (95% CI ${sgn(L.lo, 1)} to ${sgn(L.hi, 1)}): ${noise ? "within noise" : L.lo > 0 ? nameA + " wins this lane" : nameB + " wins this lane"}` +
        (base1.ok ? `; ${nameA}'s usual lane WPA${ro != null ? " as " + ROLE_L[ro] : ""} is ${pp(base1.v, 1)}` : "") +
        (Tm.ok ? `. After 15 minutes: ${pp(Tm.v, 1)}${Tm.lo <= 0 && Tm.hi >= 0 ? " (within noise)" : ""}.` : ".");
    }
  } else if (w.ok) lede = `${nameA} won ${grp(w.k)} of ${grp(w.n)} solo-queue games against ${nameB} in the same lane: ${pct(w.v)} (95% CI ${pct(w.lo)}–${pct(w.hi)}), ${w.lo > 0.5 ? "favouring " + nameA : w.hi < 0.5 ? "favouring " + nameB : "not distinguishable from even"}. Lane-phase WPA needs minute data (pro only).`;
  if (lede) main.append(h("p", {class: "lede", id: "m-lede"}, lede));
  main.append(cards);
  main.append(h("p", {class: "note"}, "A matchup rate isn't a counter by itself: it also carries who picks each champion and the rest of the draft." + (S.pro ? " Pro WPA splits the team's win probability: 0–15 min by the players' gold, XP and kill differences vs their lane opponents, 15 min–end equally." : "")));
}

/* ---------- 4. methods ---------- */
function viewAbout(r, c){
  const main = $("main"); main.textContent = "";
  const S = ST.solo, W = ST.winprob, P = ST.pro;
  const dl = (rows) => h("div", {class: "tw"}, h("table", {}, h("thead", {}, h("tr", {}, rows[0].map((x, k) => h("th", {scope: "col", class: k ? null : "l"}, x)))),
    h("tbody", {}, rows.slice(1).map(rw => h("tr", {}, rw.map((x, k) => k ? h("td", {}, x) : h("th", {scope: "row"}, x)))))));
  const src = ST.sources || {};
  const items = [h("h1", {}, "Methods and data")];
  items.push(h("h2", {}, "Data sources"), dl([["Dataset", "Games", "Dates", "Minimum sample"],
    ["Ranked solo queue 16.x", grp(S.games), `${S.dates[0]} to ${S.dates[1]}`, `${S.min} games`],
    ...Object.entries(P).map(([k, d]) => [`Pro ${k}`, grp(d.games), `${d.dates[0]} to ${d.dates[1]}`, `${d.min} games`])]),
    h("ul", {}, h("li", {}, `Solo queue: ${src.solo || "Riot match data"}. Games of 15+ minutes, no remakes; roles are Riot's team positions.`),
      h("li", {}, `Pro: ${src.pro || "Oracle's Elixir"}. Every league in the file (${Object.keys(P[ST.proDefault].leagueGames || {}).length} in ${ST.proDefault}), LCK to minor regions, pooled.`),
      h("li", {}, `Game length split: short under ${ST.short} min, long ${ST.long}+ min.`)));
  items.push(h("h2", {}, "How the numbers are computed"), h("ul", {},
    h("li", {}, "Win, pick and ban rates are counts from the data, with 95% Wilson intervals (the small grey range next to each rate). A rate from fewer than the dataset's minimum games reads “too little data”; pairs under the minimum aren't stored at all."),
    h("li", {}, "Averages (gold difference at 15, WPA, …) show the mean with a 95% interval of ±1.96 SD/√n. Green or red means the interval excludes 50% (rates) or 0 (differences); plain means it doesn't."),
    h("li", {}, "The same functions are in the Rift Logic language: winrate(), pickrate(), presence(), stat(), matchups(), wpa() and winprob(). “Open in Rift Logic” on a champion or matchup opens a program that reproduces the page's numbers.")));
  items.push(h("h2", {}, "Items, runes and summoner spells"), h("ul", {},
    h("li", {}, "Solo queue only: Oracle's Elixir (pro) has no item, rune or summoner-spell data, so the Builds and Runes tabs show a notice in pro mode."),
    h("li", {}, "The same ranked solo games as the tier list, per champion and role (Riot's team position; 100+ games in the role). Items are the final inventory at the end of the game: completed items (2000+ gold) and boots. Core builds are sets of completed items that were all in the final inventory; the order isn't known."),
    h("li", {}, "“Δ vs without”: win rate with the item minus without it, with Newcombe's 95% interval. It's biased up (players who finish more items played longer games and more often won them), so “Δ same item count” compares against the champion's win rate in games that ended with the same number of completed items."),
    h("li", {}, "Rows under 30 games aren't stored; rows under 100 are greyed. Purchase order, first item, starting items, item timing and item / rune WPA need match timelines, which are still downloading.")));
  items.push(h("h2", {}, "Win probability added (WPA)"), h("p", {}, "WPA follows the team's win probability through the game: the side prior before the game, the model's estimate at 15 minutes (gold, XP and kill differences), then the result (1 or 0). The change from the start to 15 minutes is split among the five players by Shapley values of their gold, XP and kill differences against their lane opponent: that's lane WPA. The change from 15 minutes to the end is split equally: team WPA. Total = lane + team, in percentage points per game. Lane opponents' lane WPA is exactly opposite, so a matchup's WPA is zero-sum."),
    Object.values(P).some(d => d.avg && d.avg.wpaDraft) ? h("p", {}, "With the draft phase: the change from the side prior to the draft model's estimate (after champion select, equal teams) is draft WPA, split by each player's champion terms; lane WPA then runs from the draft estimate to 15 minutes. Total = draft + lane + team.") : null,
    h("p", {}, "WPA is pro only: it needs minute-by-minute data, which the solo-queue dataset doesn't have yet."));
  if (W && W.valid){
    const V = W.valid;
    items.push(h("h2", {}, "In-game model validation"), h("p", {}, `Logistic regression per minute snapshot, fitted on ${V.train} and scored on held-out ${V.test} games. Blue side won ${pct(V.sideWinrate)} of the held-out games.`),
      dl([["Minute", "Games", "Log loss (side only)", "Brier (side only)", "Calibration error", "Accuracy", "AUC"],
        ...W.times.filter(t => V.t[t]).map(t => { const m = V.t[t].model, s = V.t[t].side; return [`${t} min`, grp(V.t[t].n), `${m.logloss} (${s.logloss})`, `${m.brier} (${s.brier})`, `${(100 * m.ece).toFixed(1)} pp`, pct(m.acc), m.auc.toFixed(3)]; })]));
  }
  if (ST.draftwp){
    items.push(h("h2", {}, "Draft model"));
    for (const [m, M] of Object.entries(ST.draftwp)){
      const v = M && M.valid; if (!v) continue;
      if (v.rows && typeof v.rows === "object"){
        const names = Object.keys(v.rows), keys = [...new Set(names.flatMap(k => Object.keys(v.rows[k] || {})))];
        items.push(h("p", {}, h("b", {}, m === "pro" ? "Pro" : "Solo queue"), `: held-out ${v.test != null ? v.test : "test"} games${v.nTest ? " (" + grp(v.nTest) + ")" : ""}${v.nTrain ? ", trained on " + grp(v.nTrain) : ""}.`),
          dl([["Model", ...keys], ...names.map(k => [k, ...keys.map(x => { const y = (v.rows[k] || {})[x]; return y == null ? "–" : String(y); })])]));
        continue;
      }
      const flat = []; const walk = (o, pre) => { for (const [k, x] of Object.entries(o)) { if (x && typeof x === "object" && !Array.isArray(x)) walk(x, pre + k + " · "); else if (typeof x === "number" || typeof x === "string") flat.push([pre + k, typeof x === "number" ? String(x) : x]); } };
      walk(v, ""); items.push(h("p", {}, h("b", {}, m === "pro" ? "Pro" : "Solo queue"), `: ${M.games ? grp(M.games) + " games" : ""}`), dl([["Validation", "Value"], ...flat.slice(0, 40)]));
    }
  }
  items.push(h("h2", {}, "Caveats"), h("ul", {},
    h("li", {}, "These are observational numbers, not controlled experiments."),
    h("li", {}, "Solo queue: a champion's win rate mixes in who picks it (mains and one-tricks win more on their champion) and the rest of the draft. A matchup rate isn't a counter by itself."),
    h("li", {}, "Pro: strong teams get the meta picks, so win rate and WPA carry team strength. Leagues of very different levels are pooled."),
    h("li", {}, "Small samples: a pro champion with 30 games has a win-rate interval about ±17 points wide. Read the intervals, not just the point estimate."),
    h("li", {}, "Pro and solo queue are separate everywhere on this page; they're basically different games.")));
  main.append(h("div", {class: "prose"}, items));
}

/* ---------- boot ---------- */
function render(){
  if (!ST) return;
  RTOK++;
  let r = parseHash();
  if (r.view === "winprob"){ history.replaceState(null, "", link("tier", [], r.q.mode ? {mode: r.q.mode} : {})); r = parseHash(); }   // the calculator page was removed
  const c = ctx(r.q);
  if (r.q.mode) MODE = c.mode;
  drawChrome(r, c);
  const V = {tier: viewTier, champ: viewChamp, matchup: viewMatchup, about: viewAbout}[r.view] || viewTier;
  try { V(r, c); } catch (e) { $("main").textContent = ""; $("main").append(h("div", {class: "card err"}, `Something went wrong: ${e.message}`)); throw e; }
  document.title = ({tier: "Tier list", champ: nameOf(champId(r.args[0]) || "") + (r.args[1] && tabOf(r.args[1]) !== "overview" ? " " + TABS.find(t => t[0] === tabOf(r.args[1]))[1].toLowerCase() : ""), matchup: "Matchup", about: "Methods"}[r.view] || "Tier list") + " · Rift Logic Stats";
}
function start(d){
  ST = d; POS = Object.create(null); ST.champs.forEach((id, i) => { POS[id] = i; });
  loadIcons(); render();
  window.addEventListener("hashchange", () => { render(); $("main").focus({preventScroll: true}); window.scrollTo(0, 0); });
}
const ready = PAGE.inline ? Promise.resolve(PAGE.inline.stats)
  : fetch("stats.json").then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); });
window.__stats = {ready: ready.then(d => { start(d); return true; }, e => { $("main").textContent = ""; $("main").append(h("div", {class: "card err"}, `The match data (stats.json) could not be loaded: ${e.message}. Reload to try again.`)); throw e; }),
  dataset: (m, y) => dataset(m, y), vsWin, vsWpa, champWin, avgOf, pos: id => POS[id], render, builds: () => loadBuilds()};
})();
</script>
